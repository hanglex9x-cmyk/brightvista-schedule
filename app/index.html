<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bright Vista – Hệ thống lịch học</title>
<link rel="manifest" href="../manifest.webmanifest"><meta name="theme-color" content="#1f4e79"><link rel="icon" href="../icons/icon-192.png">
<style>
  :root { --main:#1f4e79; --bg:#f4f6f9; --line:#d8dee6; --red:#c62828; --green:#2e7d32; --orange:#ef6c00; }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.4 Arial, sans-serif; background:var(--bg); color:#000; }
  header { background:var(--main); color:#fff; padding:10px 16px; display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
  header b { font-size:17px; }
  nav { display:flex; flex-wrap:wrap; gap:4px; padding:8px 16px; background:#fff; border-bottom:1px solid var(--line); position:sticky; top:0; z-index:5; }
  nav button { border:1px solid var(--line); background:#fff; padding:6px 10px; border-radius:6px; cursor:pointer; }
  nav button.on { background:var(--main); color:#fff; border-color:var(--main); }
  main { padding:12px 16px 40px; }
  .bar { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:10px; }
  input, select, textarea { padding:5px 7px; border:1px solid #b8c2cf; border-radius:5px; font:inherit; }
  textarea { width:100%; min-height:70px; }
  .btn { background:var(--main); color:#fff; border:0; padding:7px 14px; border-radius:6px; cursor:pointer; }
  .btn.g { background:#fff; color:var(--main); border:1px solid var(--main); }
  .btn:disabled { opacity:.5; }
  table { border-collapse:collapse; background:#fff; width:100%; }
  th, td { border:1px solid var(--line); padding:4px 6px; vertical-align:top; }
  th { background:#e8eef5; font-weight:600; text-align:left; }
  .scroll { overflow:auto; max-height:75vh; }
  .scroll th { position:sticky; top:0; z-index:1; }
  .small { font-size:12px; color:#333; }
  .tag { display:inline-block; padding:1px 6px; border-radius:9px; font-size:12px; background:#eee; }
  .t-Test1 { background:#fff3cd; } .t-Test2 { background:#ffd6d6; } .t-Trial { background:#dff0ff; } .t-Nghi { background:#eeeeee; color:#555; text-decoration:line-through; }
  .t-KT { background:#f3d9ff; } .t-HB { background:#e2f7e2; }
  .cf { background:#ffcdd2 !important; font-weight:bold; }
  .off { background:#ececec; }
  .card { background:#fff; border:1px solid var(--line); border-radius:8px; padding:12px; margin-bottom:12px; }
  .grid2 { display:grid; grid-template-columns:repeat(auto-fill, minmax(220px, 1fr)); gap:8px 14px; }
  .grid2 label { display:flex; flex-direction:column; font-size:12px; color:#222; gap:2px; }
  .msg { padding:8px 12px; border-radius:6px; margin:8px 0; }
  .msg.ok { background:#e6f4ea; color:var(--green); } .msg.err { background:#fde7e7; color:var(--red); } .msg.warn { background:#fff4e0; color:#8a4b00; }
  .loading { color:#888; padding:20px; }
  .gvcol { min-width:120px; font-size:13px; font-weight:600; color:#000; }
  td { color:#000; }
  .hide { display:none; }
  .lichrow { display:flex; gap:6px; margin:4px 0; flex-wrap:wrap; }
  a.lnk { color:var(--main); cursor:pointer; text-decoration:underline; }
  .day { margin-bottom:14px; }
  .day h3 { margin:10px 0 4px; font-size:15px; color:var(--main); }
  .sw { display:inline-block; width:10px; height:10px; border-radius:2px; margin-right:4px; border:1px solid #999; }
  @media (max-width:640px) { main { padding:8px; } th { top:0; } }

  .hb { background:transparent; color:#fff; border:1px solid rgba(255,255,255,.45); border-radius:6px; padding:5px 10px; cursor:pointer; font:inherit; }
  #bell { position:relative; } #bellN { position:absolute; top:-6px; right:-6px; background:#e53935; color:#fff; border-radius:9px; font-size:11px; padding:0 5px; font-style:normal; }
  .login { max-width:380px; margin:40px auto; display:flex; flex-direction:column; gap:10px; }
  .login h2 { margin:0; color:var(--main); } .login label { display:flex; flex-direction:column; gap:3px; font-size:13px; } .login input { padding:9px; font-size:15px; }
  .ntf { display:flex; justify-content:space-between; align-items:center; gap:10px; padding:10px 12px; border-left:4px solid; border-radius:6px; margin:8px 0; }
  .kpis { display:grid; grid-template-columns:repeat(auto-fill,minmax(170px,1fr)); gap:10px; margin-bottom:12px; }
  .kpi { background:#fff; border:1px solid var(--line); border-radius:8px; padding:10px 12px; display:flex; flex-direction:column; } .kpi b { font-size:24px; color:var(--main); }
  .cols2 { display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:0 12px; }
  .wk { width:100%; max-width:760px; height:auto; display:block; }
  .lg { display:flex; gap:12px; flex-wrap:wrap; margin:6px 0; }
  .hb2 { display:flex; flex-direction:column; gap:5px; margin-top:8px; } .hbr { display:grid; grid-template-columns:150px 1fr 48px; gap:8px; align-items:center; font-size:13px; }
  .hbl { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; } .hbt { display:flex; height:16px; background:#f0f3f7; border-radius:3px; overflow:hidden; } .hbt i { display:block; height:100%; }
  .board { display:grid; grid-template-columns:repeat(6,minmax(170px,1fr)); gap:8px; overflow-x:auto; }
  .col { background:#fff; border:1px solid var(--line); border-radius:8px; padding:6px; min-height:120px; } .col h4 { margin:2px 2px 6px; color:var(--main); font-size:14px; }
  .col.past { background:#f1f1f1; } .col.over { outline:3px dashed var(--main); background:#eef5ff; }
  .pc { background:#fff; border:1px solid var(--line); border-left:5px solid; border-radius:6px; padding:4px 6px; margin-bottom:5px; font-size:13px; cursor:grab; }
  .pc.st { opacity:.55; cursor:default; } .pc:not([draggable]) { cursor:default; } .pc.dragging { opacity:.4; }
  .dlgbg { position:fixed; inset:0; background:rgba(0,0,0,.35); display:flex; align-items:center; justify-content:center; z-index:50; padding:16px; }
  .dlg { width:min(560px,100%); max-height:90vh; overflow:auto; } .rd { display:block; margin:4px 0; }
  @media (max-width:640px) { .hbr { grid-template-columns:100px 1fr 40px; } .hb { padding:4px 7px; font-size:12px; } }
</style>
</head>
<body>
<header><b id="brand">BRIGHT VISTA</b><span id="hdr" class="small" style="color:#cfe0f1"></span><span style="flex:1"></span><button id="bell" class="hb" title="Thông báo" style="display:none">🔔<i id="bellN" style="display:none"></i></button><span id="usr" class="small" style="color:#cfe0f1;display:none"></span><button id="pwBtn" class="hb" style="display:none">Đổi mật khẩu</button><button id="outBtn" class="hb" style="display:none">Đăng xuất</button></header>
<nav id="nav"></nav>
<main id="main"><div class="loading">Đang tải…</div></main>

<script>
var MODE = '', KEY = '';
var S = {}, CUR = null;
var TABS_ADMIN = [['week','Lịch tuần GV'],['grid','Lưới theo ngày'],['free','Giờ trống GV'],['check','Kiểm tra tuần'],
  ['hv','Học viên / Tạo khóa'],['zalo','Nhật ký Zalo'],['trial','Học thử'],['cc','Chấm công'],['detail','Lịch chi tiết HV'],['slot','Slot & lương'],['bl','Bảo lưu'],['gvs','Giáo viên'],['plan','Kéo-thả lịch'],['notify','Thông báo'],['reports','Báo cáo'],['accounts','Tài khoản']];
var TABS_GV = [['week','Schedule'],['myslot','My slots'],['notify','Reminders']];
var TABS_CTV = [['range','Lịch hàng ngày'],['grid','Lưới theo ngày'],['cc','Lịch học viên tổng hợp'],['detail','Lịch chi tiết HV'],['notify','Thông báo']];
var DAYS = {1:'CN',2:'T2',3:'T3',4:'T4',5:'T5',6:'T6',7:'T7'};
var DAYS_EN = {1:'Sun',2:'Mon',3:'Tue',4:'Wed',5:'Thu',6:'Fri',7:'Sat'};

// Phần tử giả (có .value) cho trường hợp ô không còn trên màn hình.
var GHOST=document.createElement('input');
function $(id){ return document.getElementById(id) || GHOST; }
function esc(s){ return String(s===undefined||s===null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
// GEN tăng mỗi lần đổi tab: kết quả của tab cũ về muộn bị bỏ qua, không ghi đè / báo lỗi lên tab mới.
var GEN=0;
function addDays(s,n){ var p=s.split('-'), d=new Date(Date.UTC(+p[0],+p[1]-1,+p[2]+n)); return d.toISOString().slice(0,10); }
function monday(s){ var p=s.split('-'), t=new Date(Date.UTC(+p[0],+p[1]-1,+p[2])).getUTCDay(); return addDays(s, t===0?-6:1-t); }
function vn(s){ if(!s) return ''; var p=s.split('-'); return p[2]+'/'+p[1]+'/'+p[0]; }
function thuOf(s){ var p=s.split('-'); return new Date(Date.UTC(+p[0],+p[1]-1,+p[2])).getUTCDay()+1; }
function color(gv){ var t=S.teachers.filter(function(x){return x.name===gv;})[0]; var c=t?String(t.color||'').trim().toUpperCase():'';
  if(t&&c&&c!=='#FFF'&&c!=='#FFFFFF'&&c!=='WHITE') return t.color;
  var PALF=['#F8CBAD','#A9D08E','#9DC3E6','#FFE699','#C6E0B4','#F4B6C2','#B4C6E7','#FFD7A8','#A8D5BA','#BFE3DD']; var s=String(gv||''), h=0;
  for(var i=0;i<s.length;i++) h+=s.charCodeAt(i)*(i+1);
  return PALF[h%PALF.length]; }
function gvOptions(sel, all){ return (all?'<option value="">'+(MODE==='gv'?'— all teachers —':'— tất cả GV —')+'</option>':'<option value=""></option>')+S.teachers.map(function(t){return '<option'+(t.name===sel?' selected':'')+'>'+esc(t.name)+'</option>';}).join(''); }
function cls(x){ return x.type==='Test 1'?'t-Test1':x.type==='Test 2 -Final'?'t-Test2':x.type==='Trial'?'t-Trial':x.type==='Nghỉ'?'t-Nghi':x.type==='Kết thúc sớm'?'t-KT':x.type==='Học bù'?'t-HB':''; }
function msg(el, text, kind){ $(el).innerHTML='<div class="msg '+(kind||'ok')+'">'+esc(text)+'</div>'; }
function fail(e){ $('main').innerHTML='<div class="msg err">Lỗi: '+esc(e && e.message || e)+'</div>'; }
function loading(){ $('main').innerHTML='<div class="loading">Đang tính…</div>'; }

function nav(){
  var tabs = MODE==='admin'?TABS_ADMIN:MODE==='ctv'?TABS_CTV:TABS_GV;
  $('nav').innerHTML = tabs.map(function(t){return '<button data-t="'+t[0]+'" class="'+(t[0]===CUR?'on':'')+'">'+t[1]+'</button>';}).join('');
  [].forEach.call($('nav').children, function(b){ b.onclick=function(){ go(b.dataset.t); }; });
}
function go(t){ GEN++; CUR=t; nav(); try{ localStorage.setItem('bv_tab',t); }catch(e){} VIEWS[t](); }

var VIEWS = {};

// Ô có màu nền GV: nền tối → chữ trắng đậm, nền sáng → chữ đen đậm.
function textOn(bg){ var m=/^#?([0-9a-f]{6})$/i.exec(String(bg).trim()); if(!m){ var r=/rgb\((\d+),\s*(\d+),\s*(\d+)/.exec(bg); if(!r) return ''; m=[0,[r[1],r[2],r[3]].map(function(x){return ('0'+(+x).toString(16)).slice(-2);}).join('')]; }
  var n=parseInt(m[1],16), R=n>>16&255, G=n>>8&255, B=n&255; return (0.299*R+0.587*G+0.114*B)<150?'#fff':'#000'; }
function fixContrast(root){ [].forEach.call((root||document).querySelectorAll('[style*="background"]'),function(el){
  if(el.dataset.cx) return; var bg=el.style.backgroundColor; if(!bg) return; var c=textOn(bg); if(c){ el.style.color=c; el.style.fontWeight='700'; } el.dataset.cx=1; }); }
new MutationObserver(function(){ fixContrast(document.getElementById('main')); }).observe(document.getElementById('main'),{childList:true,subtree:true});

/* ---------- LỊCH TUẦN GV ---------- */
VIEWS.week = function(){
  var en = MODE==='gv';
  $('main').innerHTML='<div class="bar">'+(en?'Week from Monday':'Tuần bắt đầu thứ 2')+' <input type="date" id="wMon" value="'+S.wMon+'">'+
    '<button class="btn g" id="wPrev">◀</button><button class="btn g" id="wNext">▶</button> '+(en?'Teacher':'GV')+' <select id="wGv">'+gvOptions(S.wGv,true)+'</select>'+
    ' <input id="wQ" placeholder="'+(en?'search student':'tìm học viên')+'" size="14"></div><div id="wOut" class="loading">…</div>';
  var load=function(){
    S.wMon=monday($('wMon').value||S.monday); $('wMon').value=S.wMon; S.wGv=$('wGv').value; $('wOut').innerHTML='<div class="loading">…</div>';
    call('api_week',S.wMon,S.wGv).then(function(L){ S.wData=L; draw(); }).catch(fail);
  };
  var draw=function(){
    var q=$('wQ').value.toLowerCase(), L=S.wData.filter(function(x){return !q||x.name.toLowerCase().indexOf(q)>=0;}), h='', byDay={};
    L.forEach(function(x){ (byDay[x.date]=byDay[x.date]||[]).push(x); });
    Object.keys(byDay).sort().forEach(function(d){
      h+='<div class="day"><h3>'+(en?DAYS_EN[thuOf(d)]:DAYS[thuOf(d)])+' '+vn(d)+' <span class="small">('+byDay[d].length+(en?' lessons':' buổi')+')</span></h3><table><tr><th>'+
        (en?'Time</th><th>Teacher</th><th>Student</th><th>Age</th><th>Level</th><th>Class</th><th>Min</th><th>Lesson</th><th>Type':'Giờ</th><th>GV</th><th>Học viên</th><th>Tuổi</th><th>Level</th><th>Lớp</th><th>Phút</th><th>Buổi</th><th>Loại buổi')+'</th></tr>';
      byDay[d].forEach(function(x){
        h+='<tr class="'+cls(x)+'"><td>'+esc(x.time)+'</td><td style="background:'+color(x.gv)+'">'+esc(x.gv)+'</td><td>'+esc(x.name)+(MODE==='admin'&&x.id?' <span class="small">'+esc(x.id)+'</span>':'')+'</td><td>'+esc(x.age)+'</td><td>'+esc(x.level)+'</td><td>'+esc(x.lop)+'</td><td>'+x.dur+'</td><td>'+(x.no?x.no+'/'+x.total:'')+'</td><td>'+esc(x.type)+(x.status?' ('+esc(x.status)+')':'')+'</td></tr>';
      });
      h+='</table></div>';
    });
    $('wOut').innerHTML=(L.length?'<div class="small">'+L.length+(en?' lessons':' buổi')+'</div>':'<div class="msg warn">'+(en?'No lessons':'Không có buổi nào')+'</div>')+h;
  };
  $('wMon').onchange=load; $('wGv').onchange=load; $('wQ').oninput=function(){ if(S.wData) draw(); };
  $('wPrev').onclick=function(){ $('wMon').value=addDays(S.wMon,-7); load(); };
  $('wNext').onclick=function(){ $('wMon').value=addDays(S.wMon,7); load(); };
  load();
};

/* ---------- LƯỚI THEO NGÀY ---------- */
VIEWS.grid = function(){
  $('main').innerHTML='<div class="bar">'+(MODE==='gv'?'Day':'Ngày')+' <input type="date" id="gDay" value="'+S.gDay+'"><button class="btn g" id="gPrev">◀</button><button class="btn g" id="gNext">▶</button>'+
    ' <span class="small"><span class="sw" style="background:#ffcdd2"></span>trùng giờ <span class="sw" style="background:#f1f1f1"></span>ngoài giờ rảnh</span></div><div id="gOut" class="loading">…</div>';
  var load=function(){
    S.gDay=$('gDay').value||S.today; $('gOut').innerHTML='<div class="loading">…</div>';
    call('api_grid',S.gDay).then(function(g){
      var h='<div class="scroll"><table><tr><th>Giờ</th>'+g.teachers.map(function(t,i){return '<th class="gvcol" style="background:'+g.colors[i]+'">'+esc(t)+'</th>';}).join('')+'</tr>';
      g.slots.forEach(function(s,i){
        if(!g.cells[i].some(function(c){return c.busy;}) && (+s.slice(0,2)<17 && +s.slice(0,2)>9)) {}
        h+='<tr><td><b>'+s+'</b></td>'+g.cells[i].map(function(c){return '<td class="gvcol '+(c.conflict?'cf':c.off&&!c.busy?'off':'')+'">'+esc(c.text)+'</td>';}).join('')+'</tr>';
      });
      $('gOut').innerHTML=h+'</table></div>';
    }).catch(fail);
  };
  $('gDay').onchange=load;
  $('gPrev').onclick=function(){ var d=addDays($('gDay').value,-1); if(thuOf(d)===1) d=addDays(d,-1); $('gDay').value=d; load(); };
  $('gNext').onclick=function(){ var d=addDays($('gDay').value,1); if(thuOf(d)===1) d=addDays(d,1); $('gDay').value=d; load(); };
  load();
};

/* ---------- GIỜ TRỐNG ---------- */
VIEWS.free = function(){
  $('main').innerHTML='<div class="bar">Tuần bắt đầu <input type="date" id="fMon" value="'+S.wMon+'"> <span class="small">Giờ bắt đầu còn nhận được buổi 30\' (trong giờ rảnh, không trùng buổi đang có)</span></div><div id="fOut" class="loading">…</div>';
  var load=function(){
    S.wMon=monday($('fMon').value); $('fMon').value=S.wMon;
    call('api_free',S.wMon).then(function(r){
      var h='<div class="scroll"><table><tr><th>GV</th>'+r.days.map(function(d){return '<th>'+DAYS[thuOf(d)]+' '+vn(d).slice(0,5)+'</th>';}).join('')+'</tr>';
      r.rows.forEach(function(x){ h+='<tr><td style="background:'+color(x.gv)+'"><b>'+esc(x.gv)+'</b></td>'+x.free.map(function(f){return '<td class="small">'+esc(f)+'</td>';}).join('')+'</tr>'; });
      $('fOut').innerHTML=h+'</table></div>';
    }).catch(fail);
  };
  $('fMon').onchange=load; load();
};

/* ---------- KIỂM TRA TUẦN ---------- */
VIEWS.check = function(){
  $('main').innerHTML='<div class="bar">Tuần bắt đầu <input type="date" id="cMon" value="'+S.wMon+'"></div><div id="cOut" class="loading">…</div>';
  var tbl=function(title,arr,kind){
    var h='<div class="card"><b>'+title+'</b> <span class="tag">'+arr.length+'</span>';
    if(!arr.length) return h+' <span class="small" style="color:var(--green)">✔ không có</span></div>';
    h+='<table><tr><th>Ngày</th><th>Giờ</th><th>GV</th><th>Học viên</th><th>Loại</th></tr>';
    arr.forEach(function(x){ var a=[].concat(x); a.forEach(function(y,i){ h+='<tr class="'+(kind||'')+'"><td>'+vn(y.date)+'</td><td>'+esc(y.time)+'</td><td>'+esc(y.gv)+'</td><td>'+esc(y.name)+' <span class="small">'+esc(y.id)+'</span></td><td>'+esc(y.type)+(y.status?' ('+esc(y.status)+')':'')+'</td></tr>'; }); });
    return h+'</table></div>';
  };
  var load=function(){
    S.wMon=monday($('cMon').value); $('cMon').value=S.wMon;
    call('api_checks',S.wMon).then(function(c){
      $('cOut').innerHTML=tbl('⚠ GV trùng giờ',c.conflictGV,'cf')+tbl('⚠ Học viên trùng giờ',c.conflictHV,'cf')+tbl('Ngoài giờ rảnh của GV',c.outside)+
        tbl('Buổi Test / kết thúc khóa',c.tests)+tbl('Học thử',c.trials)+tbl('Buổi nghỉ (KP / MP / GV / ?)',c.absences)+
        '<div class="card"><b>Khóa chưa rõ số buổi còn lại</b> <span class="tag">'+c.unknown.length+'</span><br>'+c.unknown.map(function(u){return esc(u.id+' '+u.name);}).join(' · ')+'</div>';
    }).catch(fail);
  };
  $('cMon').onchange=load; load();
};

/* ---------- HỌC VIÊN / TẠO KHÓA ---------- */
function lichRowsHtml(n){
  var h=''; for(var i=0;i<n;i++) h+=lichRow();
  return h;
}
function lichRow(r){
  r=r||{};
  return '<div class="lichrow"><select class="lThu">'+[2,3,4,5,6,7].map(function(t){return '<option value="'+t+'"'+(+r.thu===t?' selected':'')+'>'+DAYS[t]+'</option>';}).join('')+'</select>'+
    '<input class="lTime" type="time" step="300" value="'+(r.time||'')+'"><select class="lGv">'+gvOptions(r.gv)+'</select>'+
    '<input class="lDur" type="number" placeholder="phút (nếu khác)" style="width:120px" value="'+(r.dur||'')+'"><button class="btn g lDel" type="button">✕</button></div>';
}
function readLich(box){
  return [].map.call($(box).querySelectorAll('.lichrow'), function(d){
    return { thu:+d.querySelector('.lThu').value, time:d.querySelector('.lTime').value, gv:d.querySelector('.lGv').value, dur:d.querySelector('.lDur').value };
  }).filter(function(r){ return r.time || r.gv; });
}
function bindLich(box, addBtn){
  $(addBtn).onclick=function(){ $(box).insertAdjacentHTML('beforeend', lichRow()); bindDel(box); };
  bindDel(box);
}
function bindDel(box){ [].forEach.call($(box).querySelectorAll('.lDel'), function(b){ b.onclick=function(){ b.parentNode.remove(); }; }); }

VIEWS.hv = function(prefill){
  prefill=prefill||{};
  $('main').innerHTML=
   '<div class="card"><b>➕ Tạo khóa mới / tái khóa</b> <span class="small">Mã HV mới tiếp theo: <b>'+esc(S.nextHv)+'</b>. Tái khóa: nhập Mã HV cũ → mã khóa tự thành HVxxxx-2, -3…</span>'+
   '<div class="grid2" style="margin-top:8px">'+

      d.lcd.map(function(r){return '<tr'+(r.to?' style="color:#999"':'')+'><td>'+r.thu+'</td><td>'+r.time+'</td><td>'+esc(r.gv)+'</td><td>'+esc(r.dur)+'</td><td>'+vn(r.from)+'</td><td>'+vn(r.to)+'</td></tr>';}).join('')+'</table>'+

      '<div class="bar"><button class="btn g" id="cCheck">Kiểm tra trùng</button><button class="btn" id="cSave">Lưu lịch mới</button></div><div id="cMsg"></div></details>'+
      '<div class="bar" style="margin-top:8px"><button class="btn g" id="cZalo">Ghi nhật ký cho khóa này</button><button class="btn g" id="cRe">Tái khóa</button></div>'+
      '<p><b>Nhật ký</b></p>'+(d.events.length?'<table><tr><th>Nhận</th><th>Loại</th><th>Từ</th><th>Đến</th><th>Nội dung</th></tr>'+d.events.map(function(e){return '<tr><td>'+vn(e.recv)+'</td><td>'+esc(e.type)+'</td><td>'+vn(e.from)+'</td><td>'+vn(e.to)+'</td><td class="small">'+esc(e.text)+'</td></tr>';}).join('')+'</table>':'<div class="small">(chưa có)</div>')+
      '<p><b>Các buổi (3 tuần trước → sắp tới)</b></p><div class="scroll" style="max-height:40vh"><table><tr><th>Ngày</th><th>Giờ</th><th>GV</th><th>Buổi</th><th>Còn lại</th><th>Loại</th></tr>'+
      d.lessons.map(function(x){return '<tr class="'+cls(x)+'"><td>'+DAYS[x.thu]+' '+vn(x.date)+'</td><td>'+esc(x.time)+'</td><td>'+esc(x.gv)+'</td><td>'+(x.no||'')+'</td><td>'+(x.remAfter===null?'?':x.remAfter)+'</td><td>'+esc(x.type)+(x.status?' ('+esc(x.status)+')':'')+'</td></tr>';}).join('')+'</table></div></div>';

    d.lcd.filter(function(r){return !r.to;}).forEach(function(r){ $('cLich').insertAdjacentHTML('beforeend', lichRow({thu:{T2:2,T3:3,T4:4,T5:5,T6:6,T7:7}[r.thu],time:r.time,gv:r.gv,dur:r.dur})); });

    $('cSave').onclick=function(){

    };
    $('cZalo').onclick=function(){ S.zaloPre={id:id,name:c.name}; go('zalo'); };
    $('cRe').onclick=function(){
      VIEWS.hv({hv:c.hv,name:c.name,born:c.born,level:c.level,lop:c.lop,dk:'Tái khóa',start:c.end?addDays(c.end,1):'',

  $('main').innerHTML='<div class="bar">Tháng <input type="month" id="mM" value="'+S.month.slice(0,7)+'"> GV <select id="mGv">'+gvOptions('',true)+'</select> <span class="small">x = học · T1/T2 = test · KP/MP/GV/? = nghỉ · TR = học thử · KT = kết thúc sớm · HB = học bù. Copy bảng → dán vào Google Sheet / Excel được.</span></div><div id="mOut" class="loading">…</div>';
  var load=function(){
    S.month=$('mM').value+'-01';
    call('api_attendance',S.month).then(function(a){
      var gv=$('mGv').value, rows=a.rows.filter(function(r){return !gv||r.gv===gv;});
      var h='<div class="scroll"><table><tr><th>GV</th><th>Mã</th><th>Học viên</th><th>Lịch</th><th>Tổng</th><th>Còn đầu</th><th>Học</th><th>Còn cuối</th>'+a.days.map(function(d){return '<th style="text-align:center'+(d.thu==='CN'?';background:#ccc':'')+'">'+d.d+'<br><span class="small">'+d.thu+'</span></th>';}).join('')+'</tr>';
      rows.forEach(function(r){
        h+='<tr><td style="background:'+color(r.gv)+'">'+esc(r.gv)+'</td><td class="small">'+esc(r.id)+'</td><td>'+esc(r.name)+'</td><td>'+esc(r.days)+'</td><td>'+r.total+'</td><td>'+r.dau+'</td><td>'+r.hoc+'</td><td'+(r.cuoi<=2?' style="color:var(--red);font-weight:bold"':'')+'>'+r.cuoi+'</td>'+
          a.days.map(function(d){ var m=r.marks[d.d]||''; return '<td style="text-align:center" class="'+(m==='T1'?'t-Test1':m==='T2'?'t-Test2':/KP|MP|GV|\?/.test(m)?'t-Nghi':m==='TR'?'t-Trial':'')+'">'+esc(m)+'</td>'; }).join('')+'</tr>';
      });
      $('mOut').innerHTML='<div class="small">'+rows.length+' khóa</div>'+h+'</table></div>';
    }).catch(fail);
  };
  $('mM').onchange=load; $('mGv').onchange=load; load();
};

/* ---------- SLOT & LƯƠNG ---------- */
VIEWS.slot = function(){
  $('main').innerHTML='<div class="bar">Tháng <input type="month" id="sM" value="'+S.month.slice(0,7)+'"> <span class="small">Slot 30\' = buổi 25–30\'; slot 60\' = buổi ≥45\' (tính 2); Trial = 1/buổi. Đơn giá & tỷ giá sửa ở tab GIAO_VIEN, CAI_DAT.</span></div><div id="sOut" class="loading">…</div>';
  var load=function(){
    S.month=$('sM').value+'-01';
    call('api_slots',S.month).then(function(s){
      var f=function(n){ return n===''?'':Number(n).toLocaleString('vi-VN'); };
      var h='<div class="card"><b>Tổng hợp lương</b><div class="scroll"><table><tr><th>GV</th><th>ESL 30\'</th><th>ESL 60\'</th><th>PRE 30\'</th><th>PRE 60\'</th><th>IELTS 30\'</th><th>IELTS 60\'</th><th>Trial</th><th>Tổng slot</th><th>Kỳ 1 (1–15)</th><th>Kỳ 2</th><th>Peso</th><th>VND</th></tr>';
      s.sum.forEach(function(r){ h+='<tr><td style="background:'+color(r.gv)+'"><b>'+esc(r.gv)+'</b></td><td>'+r.eslA+'</td><td>'+r.eslB+'</td><td>'+r.preA+'</td><td>'+r.preB+'</td><td>'+r.ieA+'</td><td>'+r.ieB+'</td><td>'+r.trial+'</td><td><b>'+r.total+'</b></td><td>'+r.k1+'</td><td>'+r.k2+'</td><td>'+f(r.peso)+'</td><td>'+f(r.vnd)+'</td></tr>'; });
      h+='</table></div></div><div class="card"><b>Slot theo ngày</b> <span class="small">(tổng slot quy đổi)</span><div class="scroll"><table><tr><th>Ngày</th>'+s.teachers.map(function(t){return '<th style="background:'+color(t)+'">'+esc(t)+'</th>';}).join('')+'</tr>';
      s.grid.forEach(function(g){ h+='<tr><td>'+g.thu+' '+vn(g.date).slice(0,5)+'</td>'+g.v.map(function(v){return '<td title="30\': '+v[0]+' · 60\': '+v[1]+' · Trial: '+v[2]+'">'+(v[3]||'')+'</td>';}).join('')+'</tr>'; });
      $('sOut').innerHTML=h+'</table></div></div>';

/* ---------- BẢO LƯU ---------- */
VIEWS.bl = function(){
  loading();
  call('api_baoluu').then(function(r){
    r.sort(function(a,b){ return a.to<b.to?-1:1; });
    $('main').innerHTML='<div class="card"><b>Danh sách bảo lưu</b> <span class="small">('+r.length+') – thêm bảo lưu ở tab Nhật ký Zalo, loại "Bảo lưu"</span>'+
      '<div class="msg warn" style="margin-top:6px">Xử lý từng dòng ở cột cuối: <b>Học lại từ</b> = chọn ngày HV đi học lại rồi bấm (lịch tự chạy tiếp từ ngày đó) · <b>Đóng hẳn khóa</b> = HV không quay lại, xóa khỏi danh sách (không sinh buổi học).</div>'+
      '<div class="scroll"><table><tr><th>Mã khóa</th><th>Học viên</th><th>Từ</th><th>Đến</th><th>Số ngày</th><th>Còn lại</th><th>Trạng thái</th><th>Nội dung</th><th>Xử lý</th></tr>'+
      r.map(function(b){ var c=/Sắp hết|Quá/.test(b.status)?'style="color:var(--red);font-weight:bold"':/Hết hạn/.test(b.status)?'style="color:#999"':'';
        return '<tr><td>'+esc(b.id)+'</td><td>'+esc(b.name)+'</td><td>'+vn(b.from)+'</td><td>'+vn(b.to)+'</td><td>'+b.days+'</td><td>'+esc(b.remaining)+'</td><td '+c+'>'+esc(b.status)+'</td><td class="small">'+esc(b.text)+'</td>'+
          '<td style="white-space:nowrap"><input type="date" class="blDate" value="'+S.today+'"> <button class="btn g blRes" data-row="'+b.row+'" data-id="'+esc(b.id)+'">Học lại từ</button> <button class="btn g blClose" data-row="'+b.row+'" data-id="'+esc(b.id)+'" style="color:var(--red)">Đóng hẳn khóa</button></td></tr>'; }).join('')+'</table></div></div>';
    var act=function(btn,action,date){
      if(action==='close' && !confirm('Đóng hẳn khóa '+btn.dataset.id+'? HV sẽ biến khỏi danh sách bảo lưu và không còn buổi học.')) return;
      btn.disabled=true;
      call('api_blAction',btn.dataset.row,btn.dataset.id,action,date).then(function(){ VIEWS.bl(); }).catch(function(e){ btn.disabled=false; alert(e.message); });
    };
    [].forEach.call(document.querySelectorAll('.blRes'),function(b){ b.onclick=function(){ act(b,'resume',b.parentNode.querySelector('.blDate').value); }; });
    [].forEach.call(document.querySelectorAll('.blClose'),function(b){ b.onclick=function(){ act(b,'close',''); }; });
  }).catch(fail);
};

    '<label>Giờ làm (ghi chú)<input id="vHours" placeholder="VD T2-T7; 17h-22h"></label>'+

    '<label>Đơn giá IELTS<input id="vPI" type="number"></label><label>Đơn giá Trial (/buổi)<input id="vPT" type="number"></label></div>'+
    '<div style="margin-top:10px"><b>Giờ rảnh</b> <span class="small">mỗi dòng = 1 khung giờ trong 1 thứ; rảnh nhiều thứ thì thêm nhiều dòng</span> <button class="btn g" id="vAdd" type="button">+ thêm dòng</button><div id="vAvail">'+availRow()+'</div></div>'+
    '<div class="bar" style="margin-top:8px"><button class="btn" id="vSave">Lưu giáo viên</button></div><div id="vMsg"></div></div>'+
    '<div class="card"><b>Danh sách giáo viên</b> <span class="small">Sửa / xóa GV hoặc giờ rảnh: vào tab GIAO_VIEN, GIO_RANH trên Google Sheet.</span><div id="vList" class="loading">…</div></div>';
  var bindDelA=function(){ [].forEach.call(document.querySelectorAll('#vAvail .aDel'),function(b){ b.onclick=function(){ b.parentNode.remove(); }; }); };
  $('vAdd').onclick=function(){ $('vAvail').insertAdjacentHTML('beforeend', availRow()); bindDelA(); }; bindDelA();
  $('vName').oninput=function(){ var t=S.teachers.filter(function(x){return x.name.toLowerCase()===$('vName').value.trim().toLowerCase();})[0];
    $('vSave').textContent=t?'Thêm giờ rảnh cho '+t.name:'Lưu giáo viên'; };
  $('vSave').onclick=function(){
    var f={name:$('vName').value.trim(),group:$('vGroup').value,color:$('vColor').value.toUpperCase(),hours:$('vHours').value,pE:$('vPE').value,pP:$('vPP').value,pI:$('vPI').value,pT:$('vPT').value,
      avail:[].map.call(document.querySelectorAll('#vAvail .lichrow'),function(d){ return {thu:+d.querySelector('.aThu').value,from:d.querySelector('.aFrom').value,to:d.querySelector('.aTo').value}; })};
    if(!f.name) return msg('vMsg','Chưa nhập tên giáo viên','warn');
    $('vSave').disabled=true;

/* ---------- LỊCH HÀNG NGÀY + GIỜ TRỐNG (link CTV) ---------- */
VIEWS.range = function(){
  if(!S.rFrom) S.rFrom=S.today;
  if(!S.rTo) S.rTo=addDays(S.today,6);
  $('main').innerHTML='<div class="bar">Từ ngày <input type="date" id="rFrom" value="'+S.rFrom+'"> Đến ngày <input type="date" id="rTo" value="'+S.rTo+'"> GV <select id="rGv">'+gvOptions(S.rGv||'',true)+'</select> <input id="rQ" placeholder="tìm học viên" size="13" value="'+esc(S.rQ||'')+'"> <button class="btn" id="rGo">Xem lịch</button></div><div id="rOut" class="loading">…</div>';
  var load=function(){
    S.rFrom=$('rFrom').value||S.today; S.rTo=$('rTo').value||S.rFrom; S.rGv=$('rGv').value; S.rQ=$('rQ').value.trim().toLowerCase();
    if(S.rTo<S.rFrom){ var t=S.rFrom; S.rFrom=S.rTo; S.rTo=t; }
    if(addDays(S.rFrom,62)<S.rTo){ S.rTo=addDays(S.rFrom,62); $('rOut').innerHTML='<div class="msg warn">Khoảng ngày quá dài, đã rút gọn còn tối đa 62 ngày.</div><div class="loading">…</div>'; }
    var mons=[], m=monday(S.rFrom);
    while(m<=S.rTo){ mons.push(m); m=addDays(m,7); }
    var lessons=[], frees=[], chain=Promise.resolve();
    mons.forEach(function(mon){
      chain=chain.then(function(){ return call('api_week',mon,''); }).then(function(L){ L.forEach(function(x){ if(x.date>=S.rFrom&&x.date<=S.rTo) lessons.push(x); }); });
      if(S.rGv){ chain=chain.then(function(){ return call('api_free',mon); }).then(function(F){ F.rows.forEach(function(r){ if(r.gv===S.rGv){ F.days.forEach(function(d,i){ if(d>=S.rFrom&&d<=S.rTo) frees.push({date:d,free:r.free[i]}); }); } }); }); }
    });
    chain.then(function(){
      lessons=lessons.filter(function(x){ return (!S.rGv||x.gv===S.rGv)&&(!S.rQ||x.name.toLowerCase().indexOf(S.rQ)>=0); });
      lessons.sort(function(a,b){ return a.date<b.date?-1:a.date>b.date?1:(a.time<b.time?-1:1); });
      var h='', byDay={};
      lessons.forEach(function(x){ (byDay[x.date]=byDay[x.date]||[]).push(x); });
      Object.keys(byDay).sort().forEach(function(d){
        h+='<div class="day"><h3>'+DAYS[thuOf(d)]+' '+vn(d)+' <span class="small">('+byDay[d].length+' buổi)</span></h3><table><tr><th>Giờ</th><th>GV</th><th>Học viên</th><th>Tuổi</th><th>Level</th><th>Lớp</th><th>Phút</th><th>Buổi</th><th>Loại buổi</th></tr>';
        byDay[d].forEach(function(x){ h+='<tr class="'+cls(x)+'"><td>'+esc(x.time)+'</td><td style="background:'+color(x.gv)+'">'+esc(x.gv)+'</td><td>'+esc(x.name)+'</td><td>'+esc(x.age)+'</td><td>'+esc(x.level)+'</td><td>'+esc(x.lop)+'</td><td>'+x.dur+'</td><td>'+(x.no?x.no+'/'+x.total:'')+'</td><td>'+esc(x.type)+(x.status?' ('+esc(x.status)+')':'')+'</td></tr>'; });
        h+='</table></div>';
      });
      if(S.rGv){
        h+='<div class="card"><b>Giờ trống của '+esc(S.rGv)+'</b> <span class="small">(giờ bắt đầu còn nhận được buổi 30 phút, trong giờ rảnh của GV)</span><table style="margin-top:6px"><tr><th>Ngày</th><th>Giờ còn trống</th></tr>'+
          frees.map(function(f){ return '<tr><td>'+DAYS[thuOf(f.date)]+' '+vn(f.date)+'</td><td>'+esc(f.free||'—')+'</td></tr>'; }).join('')+'</table></div>';
      }
      $('rOut').innerHTML=(lessons.length?'<div class="small">'+lessons.length+' buổi từ '+vn(S.rFrom)+' đến '+vn(S.rTo)+'</div>':'<div class="msg warn">Không có buổi nào trong khoảng này</div>')+h;
    }).catch(fail);
  };
  $('rGo').onclick=load; load();
};

/* ---------- LỊCH CHI TIẾT HV (gửi phụ huynh — Admin + CTV) ---------- */
VIEWS.detail = function(){
  $('main').innerHTML='<div class="bar">Tìm học viên <input id="dQ" placeholder="gõ tên hoặc mã khóa" size="22"> <button class="btn" id="dGo">Tìm</button></div><div id="dOut" style="margin-bottom:10px"></div><div id="dList"></div>';
  var pick=function(id){
    $('dOut').innerHTML='<div class="loading">Đang tính…</div>'; window.scrollTo(0,0);
    call('api_studentDetail',id).then(function(r){
      if(!r){ $('dOut').innerHTML='<div class="msg warn">Không tìm thấy khóa.</div>'; return; }
      var head='Học viên: '+esc(r.name)+(r.dk==='Tái khóa'?' bắt đầu tái khóa từ ':' bắt đầu khóa từ ')+vn(r.start)+', khóa '+esc(r.total)+' buổi '+esc(r.dur)+"&#8242;";
      var h='<div style="border:1px solid #ccc;max-width:1100px"><div style="background:#ed7d31;color:#fff;font-weight:bold;padding:8px 10px">'+head+'</div>';
      h+='<div style="display:flex;flex-wrap:wrap;gap:0;align-items:flex-start">';
      r.months.forEach(function(m){
        h+='<table style="border-collapse:collapse;margin:0"><tr><th colspan="2" style="background:#fff2cc;border:1px solid #ccc;padding:4px 10px">'+esc(m.label)+'</th></tr><tr><th style="border:1px solid #ccc;padding:3px 8px">Ngày</th><th style="border:1px solid #ccc;padding:3px 8px">Tình trạng</th></tr>';
        m.rows.forEach(function(x){ h+='<tr><td style="border:1px solid #ccc;padding:3px 8px">'+esc(x.date)+'</td><td style="border:1px solid #ccc;padding:3px 8px'+(x.red?';color:red':'')+'">'+esc(x.text)+'</td></tr>'; });
        h+='<tr><td colspan="2" style="background:#bdd7ee;border:1px solid #ccc;text-align:center;font-weight:bold;padding:3px">'+m.total+'</td></tr></table>';
      });
      h+='</div><div style="background:#ed7d31;color:#fff;font-weight:bold;padding:8px 10px">Tính đến hết ngày '+esc(r.lastDate)+' là :'+esc(r.expr||'0')+' = '+r.sum+' buổi học ( học viên học '+r.sum+' buổi )'+(r.remaining!==null&&r.remaining!==''&&r.remaining!==undefined?' – còn lại '+esc(r.remaining)+' buổi':'')+'</div></div>';
      h+='<div class="small" style="margin-top:6px">Gửi phụ huynh: bôi đen bảng trên → Copy → dán vào Zalo / Sheet / Excel, hoặc in trang này.</div>';
      $('dOut').innerHTML=h;
    }).catch(fail);
  };
  var search=function(){
    var q=$('dQ').value.trim();
    $('dList').innerHTML='<div class="loading">…</div>';

function hbars(rows, fmt){   // rows: [label, [giá trị...], [màu...]]
  var mx=Math.max.apply(null,rows.map(function(r){ return r[1].reduce(function(a,b){return a+b;},0); }).concat([1]));
  return '<div class="hb2">'+rows.map(function(r){ var tot=r[1].reduce(function(a,b){return a+b;},0);
    return '<div class="hbr"><span class="hbl">'+esc(r[0])+'</span><span class="hbt">'+r[1].map(function(v,i){ return v?'<i style="width:'+(v/mx*100)+'%;background:'+r[2][i]+'" title="'+v+'"></i>':''; }).join('')+'</span><b>'+(fmt?fmt(tot):tot)+'</b></div>'; }).join('')+'</div>';
}
function legend(items){ return '<div class="small lg">'+items.map(function(x){ return '<span><span class="sw" style="background:'+x[1]+'"></span>'+esc(x[0])+'</span>'; }).join('')+'</div>'; }
function weekChart(W){
  var w=640,h=200,pl=30,pb=34,bw=(w-pl)/W.length, mx=Math.max.apply(null,W.map(function(x){return x.learned+x.planned+x.off;}).concat([1]));
  var y=function(v){ return (h-pb)*(1-v/mx); }, s='<svg viewBox="0 0 '+w+' '+h+'" class="wk" role="img" aria-label="Số buổi theo tuần">';
  for(var k=0;k<=4;k++){ var v=Math.round(mx*k/4); s+='<line x1="'+pl+'" x2="'+w+'" y1="'+y(v)+'" y2="'+y(v)+'" stroke="#e3e8ef"/><text x="'+(pl-4)+'" y="'+(y(v)+4)+'" text-anchor="end" font-size="10" fill="#555">'+v+'</text>'; }
  W.forEach(function(x,i){ var X=pl+i*bw+bw*0.18, BW=bw*0.64, acc=0;
    [['learned','#1f4e79'],['planned','#9dc3e6'],['off','#bdbdbd']].forEach(function(p){ var v=x[p[0]]; if(!v) return;
      s+='<rect x="'+X+'" y="'+y(acc+v)+'" width="'+BW+'" height="'+(y(acc)-y(acc+v))+'" fill="'+p[1]+'"><title>'+v+'</title></rect>'; acc+=v; });
    s+='<text x="'+(X+BW/2)+'" y="'+(y(acc)-4)+'" text-anchor="middle" font-size="11" font-weight="700">'+(acc||'')+'</text>';
    s+='<text x="'+(X+BW/2)+'" y="'+(h-pb+14)+'" text-anchor="middle" font-size="10" fill="#333">'+x.monday.slice(8)+'/'+x.monday.slice(5,7)+'</text>'; });
  return s+'</svg>';
}

    '<label>Ngày học mới<input id="mD" type="date" min="'+S.today+'" value="'+d+'"></label><label>Giờ<input id="mT" type="time" step="300" value="'+esc(x.time)+'"></label>'+
    '<label>Giáo viên<select id="mG">'+gvOptions(x.gv)+'</select></label></div>'+
    '<div style="margin:10px 0"><label class="rd"><input type="radio" name="mK" value="one" checked> Chỉ buổi này (ghi Nhật ký Zalo)</label><label class="rd"><input type="radio" name="mK" value="fix"> Từ tuần này trở đi (đổi lịch cố định)</label></div>'+
    '<label class="small">Nội dung tin Zalo / lý do<textarea id="mX" placeholder="vd: PH xin dời sang thứ 5"></textarea></label>'+
    '<div class="bar" style="margin-top:8px"><button class="btn g" id="mChk">Kiểm tra trùng</button><button class="btn" id="mOk">Lưu vào Sheet</button><button class="btn g" id="mNo">Hủy</button></div><div id="mMsg"></div></div>';
  document.body.appendChild(m);
  m.onclick=function(e){ if(e.target===m) closeDlg(); };
  $('mNo').onclick=closeDlg;
  var kind=function(){ return (document.querySelector('input[name=mK]:checked')||{}).value; };
  var newLich=function(){ return call('api_course',x.id).then(function(c){
    var nd=$('mD').value, rows=c.lcd.filter(function(r){ return !r.to || r.to>=nd; }), hit=false;
    var NUM={CN:1,T2:2,T3:3,T4:4,T5:5,T6:6,T7:7};
    var lich=rows.map(function(r){ var o={thu:NUM[r.thu],time:r.time,gv:r.gv,dur:r.dur||''};
      if(!hit && o.thu===thuOf(x.date) && o.time===x.time){ hit=true; o={thu:thuOf(nd),time:$('mT').value,gv:$('mG').value,dur:o.dur}; }
      return o; });
    if(!hit) throw new Error('Không tìm thấy dòng lịch cố định '+DAYS[thuOf(x.date)]+' '+x.time+' của khóa này (buổi học bù / dời?) – dùng "Chỉ buổi này".');
    return lich; }); };
  var fromOf=function(){ var nd=$('mD').value; return nd<x.date?nd:x.date; };
  $('mChk').onclick=function(){
    var nd=$('mD').value; if(!nd){ msg('mMsg','Chọn ngày mới','err'); return; }
    var p=kind()==='fix'?newLich().then(function(l){ return call('api_checkLich',l,fromOf(),x.id); })
      :call('api_checkLich',[{thu:thuOf(nd),time:$('mT').value,gv:$('mG').value,dur:x.dur}],nd,x.id);
    p.then(function(r){ $('mMsg').innerHTML=r.length?'<div class="msg warn">'+r.map(esc).join('<br>')+'</div>':'<div class="msg ok">✔ Không trùng, đúng giờ rảnh</div>'; }).catch(function(e){ msg('mMsg',e.message,'err'); });
  };
  $('mOk').onclick=function(){
    var nd=$('mD').value, nt=$('mT').value, ng=$('mG').value, txt=$('mX').value||'Kéo-thả trên lịch';
    if(!nd||nd<S.today){ msg('mMsg','Ngày mới phải từ hôm nay trở đi','err'); return; }
    if(nd===x.date&&nt===x.time&&ng===x.gv){ msg('mMsg','Chưa thay đổi gì','warn'); return; }
    $('mOk').disabled=true;
    var p;
    if(kind()==='fix') p=newLich().then(function(l){ return call('api_changeLich',x.id,fromOf(),l); });
    else if(nd===x.date) p=call('api_addEvent',{type:'Đổi giờ/GV 1 buổi',id:x.id,from:nd,to:nd,newTime:nt!==x.time?nt:'',newGv:ng!==x.gv?ng:'',who:S.u,text:txt});
    else p=call('api_addEvent',{type:'Dời buổi',id:x.id,from:x.date,to:nd,newTime:nt!==x.time?nt:'',newGv:ng!==x.gv?ng:'',who:S.u,text:txt});
    p.then(function(){ closeDlg(); VIEWS.plan(); bell(); }).catch(function(e){ $('mOk').disabled=false; msg('mMsg',e.message,'err'); });
  };
}

// &z=1.5 trên link: phóng to cả trang
(function(){ var z=+new URLSearchParams(location.search).get('z'); if(z>=0.5&&z<=3) document.body.style.zoom=z; })();
if(TOK) start(); else showLogin();
</script>
