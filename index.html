<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BrightVista English Center</title>
<meta name="theme-color" content="#1E3A8A">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="BrightVista">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://cdn.tailwindcss.com">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={theme:{extend:{fontFamily:{sans:['Inter','system-ui','sans-serif']},colors:{navy:'#1E3A8A',brand:'#2563EB'}}}};</script>
<script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{background:#F8FAFC}[hidden]{display:none!important}
.fade{animation:fd .2s ease}@keyframes fd{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.fade{animation:none}}
:focus-visible{outline:2px solid #2563EB;outline-offset:2px}
details>summary::-webkit-details-marker{display:none}
</style>
</head>
<body class="font-sans min-h-screen grid place-items-center bg-[#1E3A8A] text-white">
<main class="text-center px-6">
  <div class="mx-auto grid place-items-center w-20 h-20 rounded-3xl bg-white/15 text-5xl animate-pulse">🎓</div>
  <h1 class="mt-5 text-3xl font-extrabold tracking-tight">BrightVista</h1>
  <p class="text-blue-200">English Center</p>
  <div class="mt-6 mx-auto w-40 h-1.5 rounded-full bg-white/20 overflow-hidden"><div id="bar" class="h-full w-0 bg-white rounded-full" style="transition:width .9s ease"></div></div>
  <p class="mt-4 text-sm text-blue-200">Loading dashboard… <a href="portal.html" class="underline text-white">Open now</a></p>
  <p class="mt-8 text-xs text-blue-300">Teacher guide (current system): <a href="guide/teacher.html" class="underline">guide/teacher.html</a></p>
</main>
<script>requestAnimationFrame(function(){document.getElementById('bar').style.width='100%'});setTimeout(function(){location.replace('portal.html')},1000);</script>
</body>
</html>
