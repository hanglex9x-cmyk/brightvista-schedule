<body class="font-sans text-slate-800 antialiased">
<script>/* BrightVista – lõi dùng chung cho mọi portal (nhúng vào từng file HTML khi build).
   CSDL demo: localStorage 'brightvista_db'. Lịch tuần tính sẵn lưu đệm 5 phút: 'brightvista_cache'. */
var BV = (function () {
  'use strict';
  var KEY = 'brightvista_db', CKEY = 'brightvista_cache', TTL = 300000;
  var pad = function (n) { return (n < 10 ? '0' : '') + n; };
  var iso = function (d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };
  var parse = function (s) { var p = String(s).split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); };
  var addD = function (d, n) { var x = new Date(d); x.setDate(x.getDate() + n); return x; };
  var monOf = function (d) { var x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); return addD(x, -((x.getDay() + 6) % 7)); };
  var tm = function (t) { var p = String(t || '0:0').split(':'); return +p[0] * 60 + (+p[1] || 0); };
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  var MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  var WD = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
  var TYPE = { IELTS: { c: '#3B82F6', bg: 'bg-blue-50', tx: 'text-blue-700' }, TOEIC: { c: '#F59E0B', bg: 'bg-amber-50', tx: 'text-amber-700' }, Kids: { c: '#8B5CF6', bg: 'bg-violet-50', tx: 'text-violet-700' } };
  var ROOMS = [{ id: '101', cap: 12 }, { id: '103', cap: 15 }, { id: '201', cap: 20 }, { id: '202', cap: 20 }, { id: '204', cap: 16 }, { id: '301', cap: 24 }];
  var store = {
    get: function (k, d) { try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
    set: function (k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* riêng tư / đầy */ } },
    del: function (k) { try { localStorage.removeItem(k); } catch (e) { } }
  };

  /* ---------- dữ liệu mẫu ---------- */
  function seed() {
    var today = new Date(), w0 = monOf(today);
    var teachers = [
      { id: 't1', name: 'Mr. David', avatar: '#2563EB', skill: 'IELTS Speaking', email: 'david@brightvista.edu' },
      { id: 't2', name: 'Ms. Anna', avatar: '#8B5CF6', skill: 'Kids English', email: 'anna@brightvista.edu' },
      { id: 't3', name: 'Ms. Sarah', avatar: '#F59E0B', skill: 'TOEIC Reading', email: 'sarah@brightvista.edu' },
      { id: 't4', name: 'Mr. James', avatar: '#0EA5E9', skill: 'TOEIC Listening', email: 'james@brightvista.edu' },
      { id: 't5', name: 'Ms. Linh', avatar: '#10B981', skill: 'IELTS Writing & Phonics', email: 'linh@brightvista.edu' }];
    var classes = [
      { id: 'c1', name: 'IELTS Speaking', type: 'IELTS', level: 'B2', teacherId: 't1', room: '201', fee: 2400000 },
      { id: 'c2', name: 'IELTS Writing', type: 'IELTS', level: 'B1', teacherId: 't5', room: '204', fee: 2400000 },
      { id: 'c3', name: 'TOEIC Reading', type: 'TOEIC', level: '600+', teacherId: 't3', room: '202', fee: 2100000 },
      { id: 'c4', name: 'TOEIC Listening', type: 'TOEIC', level: '450+', teacherId: 't4', room: '202', fee: 2100000 },
      { id: 'c5', name: 'Kids Fun English', type: 'Kids', level: 'Starters', teacherId: 't2', room: '103', fee: 1600000 },
      { id: 'c6', name: 'Kids Phonics', type: 'Kids', level: 'Pre-A1', teacherId: 't5', room: '103', fee: 1500000 }];
    var S = [['c1', 0, '09:00', '10:30'], ['c1', 2, '09:00', '10:30'], ['c1', 4, '09:00', '10:30'], ['c1', 5, '09:00', '10:30'],
      ['c2', 1, '18:00', '19:30'], ['c2', 3, '18:00', '19:30'], ['c2', 5, '14:00', '15:30'], ['c2', 6, '09:00', '10:30'],
      ['c3', 0, '17:00', '18:30'], ['c3', 1, '10:45', '12:15'], ['c3', 3, '10:45', '12:15'], ['c3', 5, '10:45', '12:15'],
      ['c4', 0, '19:00', '20:30'], ['c4', 2, '19:00', '20:30'], ['c4', 4, '18:00', '19:30'], ['c4', 6, '14:00', '15:30'],
      ['c5', 0, '14:00', '15:00'], ['c5', 2, '16:00', '17:00'], ['c5', 3, '14:00', '15:00'], ['c5', 5, '08:00', '09:00'],
      ['c6', 1, '16:00', '17:00'], ['c6', 2, '14:00', '15:00'], ['c6', 4, '16:00', '17:00'], ['c6', 5, '16:00', '17:00']];
    var schedules = S.map(function (x, i) { var c = classes.filter(function (k) { return k.id === x[0]; })[0]; return { id: 'sc' + (i + 1), classId: x[0], day: x[1], time: x[2], end: x[3], room: c.room }; });
    var N = ['Nguyễn Minh An', 'Trần Bảo Châu', 'Lê Gia Huy', 'Phạm Khánh Linh', 'Hoàng Đức Minh', 'Võ Ngọc Hân', 'Đặng Quốc Bảo', 'Bùi Thảo Vy', 'Đỗ Hải Nam', 'Ngô Phương Anh',
      'Dương Tuấn Kiệt', 'Lý Mai Chi', 'Phan Đăng Khoa', 'Vũ Hà My', 'Trịnh Gia Bảo', 'Mai Thùy Dương', 'Hồ Minh Khôi', 'Tạ Ngọc Diệp', 'Lâm Quang Vinh', 'Cao Bảo Ngọc',
      'Đinh Hoàng Long', 'Châu Thanh Tâm', 'Kiều Anh Thư', 'Lục Minh Đức', 'Quách Gia Hân', 'Tôn Nhật Minh', 'Âu Khánh Vy', 'Hà Thiên Ân', 'La Bảo Trâm', 'Từ Minh Quân'];
    var PCOL = ['#2563EB', '#8B5CF6', '#F59E0B', '#0EA5E9', '#10B981', '#EC4899'];
    var students = N.map(function (n, i) {
      var c = classes[i % 6], last = n.split(' ')[0];
      return { id: 'S' + pad(i + 1), name: n, level: c.level, class: c.id, avatar: PCOL[i % 6], dob: (c.type === 'Kids' ? 2016 : 2006) + (i % 4) + '-0' + (1 + i % 9) + '-1' + (i % 9),
        parent: { name: (i % 2 ? 'Mrs. ' : 'Mr. ') + last + ' ' + ['Hùng', 'Lan', 'Dũng', 'Hoa', 'Tuấn', 'Nga'][i % 6], phone: '09' + (12345678 + i * 104729) % 100000000, email: 'parent' + (i + 1) + '@mail.com' } };
    });
    var attendance = [], k = 0;
    for (var back = 21; back >= 1 && attendance.length < 100; back--) {
      var d = addD(today, -back), wd = (d.getDay() + 6) % 7;
      schedules.filter(function (s) { return s.day === wd; }).forEach(function (s) {
        students.filter(function (st) { return st.class === s.classId; }).forEach(function (st) {
          if (attendance.length >= 100) return;
          k++; var st2 = k % 13 === 0 ? 'Absent' : k % 7 === 0 ? 'Late' : 'Present';
          attendance.push({ id: 'a' + k, studentId: st.id, scheduleId: s.id, classId: s.classId, date: iso(d), status: st2, note: st2 === 'Late' ? 'Late 10 min' : st2 === 'Absent' ? 'Sick' : '' });
        });
      });
    }
    var m = iso(today).slice(0, 7), pm = iso(addD(new Date(today.getFullYear(), today.getMonth(), 1), -1)).slice(0, 7);
    var payments = [];
    students.forEach(function (st, i) {
      var c = classes.filter(function (x) { return x.id === st.class; })[0];
      payments.push({ id: 'p' + (i * 2 + 1), studentId: st.id, month: pm, amount: c.fee, status: i % 10 === 3 ? 'Overdue' : 'Paid', paidAt: i % 10 === 3 ? '' : pm + '-0' + (2 + i % 7) });
      payments.push({ id: 'p' + (i * 2 + 2), studentId: st.id, month: m, amount: c.fee, status: i % 4 === 0 ? 'Unpaid' : i % 10 === 3 ? 'Overdue' : 'Paid', paidAt: i % 4 === 0 || i % 10 === 3 ? '' : m + '-0' + (1 + i % 5) });
    });
    var comments = students.slice(0, 18).map(function (st, i) {
      var c = classes.filter(function (x) { return x.id === st.class; })[0];
      return { id: 'cm' + i, studentId: st.id, teacherId: c.teacherId, date: iso(addD(today, -(i % 10) - 1)),
        text: ['Great pronunciation progress this week.', 'Needs more vocabulary practice at home.', 'Very active in speaking activities.', 'Homework done carefully, keep it up!', 'Please review grammar unit 4.', 'Confident presentation today.'][i % 6] };
    });
    var homework = classes.map(function (c, i) { return { id: 'h' + i, classId: c.id, title: ['Speaking part 2: describe a place', 'Task 2 essay: technology', 'Reading test 3 (Part 7)', 'Listening Part 3 practice', 'Unit 5 song + flashcards', 'Phonics worksheet: sh / ch'][i], due: iso(addD(today, 2 + i % 3)) }; });
    return { v: 1, created: iso(today), students: students, teachers: teachers, classes: classes, schedules: schedules, attendance: attendance, payments: payments, comments: comments, homework: homework };
  }
  var DB = null;
  function db() { if (!DB) { DB = store.get(KEY, null); if (!DB || DB.v !== 1) { DB = seed(); save(); } } return DB; }
  function save() { store.set(KEY, DB); store.del(CKEY); }
  function reset() { store.del(KEY); store.del(CKEY); DB = null; return db(); }
  function by(list, id) { for (var i = 0; i < list.length; i++) if (list[i].id === id) return list[i]; return null; }
  function uid(p) { return p + Date.now().toString(36) + Math.floor(Math.random() * 1e4).toString(36); }

  /* ---------- buổi học theo ngày (lịch tuần lặp lại), lưu đệm 5 phút ---------- */
  function sessions(from, to) {
    var key = iso(from) + '_' + iso(to), c = store.get(CKEY, null);
    if (c && c.key === key && Date.now() - c.t < TTL) return c.data;
    var D = db(), out = [];
    for (var d = new Date(from); d <= to; d = addD(d, 1)) {
      var wd = (d.getDay() + 6) % 7, ds = iso(d);
      D.schedules.forEach(function (s) {
        if (s.day !== wd || (s.date && s.date !== ds)) return;
        var cl = by(D.classes, s.classId); if (!cl) return;
        out.push({ id: s.id + '|' + ds, scheduleId: s.id, classId: cl.id, date: ds, time: s.time, end: s.end, room: s.room || cl.room, name: cl.name, type: cl.type, level: cl.level, teacherId: cl.teacherId });
      });
    }
    out.sort(function (a, b) { return a.date < b.date ? -1 : a.date > b.date ? 1 : tm(a.time) - tm(b.time); });
    store.set(CKEY, { key: key, t: Date.now(), data: out });
    return out;
  }
  function roster(classId) { return db().students.filter(function (s) { return s.class === classId; }); }
  function attOf(sessionDate, classId) { return db().attendance.filter(function (a) { return a.date === sessionDate && a.classId === classId; }); }
  function presentCount(se) { var A = attOf(se.date, se.classId); return { p: A.filter(function (a) { return a.status === 'Present'; }).length, l: A.filter(function (a) { return a.status === 'Late'; }).length, a: A.filter(function (a) { return a.status === 'Absent'; }).length, n: roster(se.classId).length, done: A.length > 0 }; }
  function setAttendance(se, map, notes) {
    var D = db();
    D.attendance = D.attendance.filter(function (a) { return !(a.date === se.date && a.classId === se.classId); });
    Object.keys(map).forEach(function (sid) { D.attendance.push({ id: uid('a'), studentId: sid, scheduleId: se.scheduleId, classId: se.classId, date: se.date, status: map[sid], note: (notes && notes[sid]) || '' }); });
    save();
  }
  function rateOf(list) { if (!list.length) return 0; return Math.round(list.filter(function (a) { return a.status !== 'Absent'; }).length / list.length * 100); }

  /* ---------- giao diện ---------- */
  var IC = {
    dash: '<path d="M3 13h8V3H3zm10 8h8V11h-8zM3 21h8v-6H3zm10-18v6h8V3z"/>',
    stu: '<path d="M12 3 2 8l10 5 10-5-10-5Zm-6 7.5V15c0 1.7 2.7 3 6 3s6-1.3 6-3v-4.5"/>',
    cls: '<path d="M4 5h16v11H4zM8 20h8M12 16v4"/>',
    cal: '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/>',
    tea: '<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',
    room: '<path d="M4 21V5a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v16M2 21h20M14 12h.01"/>',
    att: '<path d="m9 12 2 2 4-4"/><rect x="3" y="4" width="18" height="17" rx="2"/>',
    pay: '<rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/>',
    rep: '<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',
    hw: '<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5z"/><path d="M8 7h8M8 11h6"/>',
    home: '<path d="m3 11 9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
    user: '<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',
    chat: '<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>',
    plus: '<path d="M12 5v14M5 12h14"/>', dl: '<path d="M12 3v12m0 0-4-4m4 4 4-4M4 21h16"/>', edit: '<path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>', del: '<path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/>'
  };
  var svg = function (k, c) { return '<svg class="' + (c || 'w-5 h-5') + '" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24" aria-hidden="true">' + (IC[k] || '') + '</svg>'; };
  var ini = function (n) { return String(n).replace(/^(Mr\.|Ms\.|Mrs\.)\s*/, '').split(' ').filter(Boolean).map(function (w) { return w[0]; }).join('').slice(-2).toUpperCase(); };
  var avatar = function (name, color, size) { return '<span class="grid place-items-center shrink-0 rounded-full text-white font-bold ' + (size || 'w-9 h-9 text-xs') + '" style="background:' + (color || '#2563EB') + '">' + esc(ini(name)) + '</span>'; };
  var weekLabel = function (w) { var e = addD(w, 6); return MON[w.getMonth()] + ' ' + w.getDate() + '–' + (e.getMonth() !== w.getMonth() ? MON[e.getMonth()] + ' ' + e.getDate() : e.getDate()) + ', ' + e.getFullYear(); };
  var money = function (n) { return (+n || 0).toLocaleString('vi-VN') + ' ₫'; };
  var $ = function (id) { return document.getElementById(id); };

  /** Khung trang: sidebar navy 260px (PC), thanh trên có link các portal, bottom nav 5 mục (mobile). */
  function layout(o) {
    // o = {base:'../', portal:'admin', title, sub, nav:[[id,label,icon]], bnav:[[id,label,icon]], userName, userSub, picker:'html'}
    var P = [['portal.html', 'Dashboard'], ['admin/', 'Admin'], ['teacher/', 'Teacher'], ['student/', 'Student'], ['parent/', 'Parent']];
    document.body.insertAdjacentHTML('afterbegin',
      '<aside class="hidden lg:flex fixed inset-y-0 left-0 w-[260px] flex-col bg-[#1E3A8A] text-white z-40">' +
      '<a href="' + o.base + 'portal.html" class="flex items-center gap-3 px-6 pt-7 pb-6"><span class="grid place-items-center w-11 h-11 rounded-xl bg-white/15 text-2xl">🎓</span><span><b class="block text-xl tracking-tight">BrightVista</b><span class="text-sm text-blue-200">' + esc(o.brandSub || 'English Center') + '</span></span></a>' +
      '<nav id="bvSide" class="flex-1 px-4 space-y-1 overflow-y-auto" aria-label="Main"></nav>' +
      '<div class="m-4 p-3 rounded-xl bg-white/10 flex items-center gap-3"><span id="bvAva">' + avatar(o.userName || 'Admin', '#60A5FA', 'w-10 h-10 text-sm') + '</span><div class="min-w-0"><p id="bvUser" class="font-semibold text-sm truncate">' + esc(o.userName || '') + '</p><p id="bvUserSub" class="text-xs text-blue-200 truncate">' + esc(o.userSub || '') + '</p></div></div>' +
      '<div class="flex gap-2 px-4 pb-5"><button type="button" data-chpw class="flex-1 h-9 rounded-lg bg-white/10 hover:bg-white/20 text-xs font-semibold">Đổi mật khẩu</button><button type="button" data-logout class="flex-1 h-9 rounded-lg bg-white/10 hover:bg-white/20 text-xs font-semibold">Đăng xuất</button></div></aside>' +
      '<div class="lg:ml-[260px] min-h-screen pb-24 lg:pb-10">' +
      '<header class="sticky top-0 z-30 bg-white/90 backdrop-blur border-b border-slate-100"><div class="flex items-center gap-3 px-4 lg:px-8 h-14">' +
      '<a href="' + o.base + 'portal.html" class="lg:hidden grid place-items-center w-9 h-9 rounded-lg bg-[#1E3A8A] text-lg">🎓</a>' +
      '<div class="min-w-0 flex-1"><h1 id="bvTitle" class="font-extrabold text-slate-900 truncate"></h1></div>' + (o.picker || '') +
      '<nav class="hidden md:flex items-center gap-1 text-sm" aria-label="Portals">' + P.map(function (p) { var on = p[1].toLowerCase() === o.portal; return '<a href="' + o.base + p[0] + '" class="px-2.5 py-1.5 rounded-lg font-semibold ' + (on ? 'bg-blue-50 text-[#2563EB]' : 'text-slate-500 hover:text-slate-900') + '">' + p[1] + '</a>'; }).join('<span class="text-slate-300">|</span>') + '</nav>' +
      '<details class="md:hidden relative"><summary class="list-none grid place-items-center w-9 h-9 rounded-lg border border-slate-200 text-slate-600" aria-label="Switch portal">⇄</summary><div class="absolute right-0 mt-2 w-44 bg-white rounded-xl shadow-xl border border-slate-100 p-1">' +
      P.map(function (p) { return '<a href="' + o.base + p[0] + '" class="block px-3 py-2 rounded-lg text-sm font-semibold ' + (p[1].toLowerCase() === o.portal ? 'text-[#2563EB] bg-blue-50' : 'text-slate-700') + '">' + p[1] + '</a>'; }).join('') +
      '<hr class="my-1 border-slate-100"><button type="button" data-chpw class="block w-full text-left px-3 py-2 rounded-lg text-sm font-semibold text-slate-700">Đổi mật khẩu</button><button type="button" data-logout class="block w-full text-left px-3 py-2 rounded-lg text-sm font-semibold text-red-600">Đăng xuất</button></div></details>' +
      '</div></header><main id="bvMain" class="px-4 lg:px-8 pt-5 lg:pt-8"><p id="bvSub" class="hidden lg:block text-slate-500 -mt-3 mb-6"></p><div id="bvView"></div></main></div>' +
      '<nav class="lg:hidden fixed bottom-0 inset-x-0 z-40 bg-white border-t border-slate-200" style="padding-bottom:env(safe-area-inset-bottom,0px)" aria-label="Bottom"><div id="bvBottom" class="grid grid-cols-' + o.bnav.length + '"></div></nav>' +
      '<div id="bvModal" class="fixed inset-0 z-50 bg-slate-900/50 grid place-items-end sm:place-items-center" hidden role="dialog" aria-modal="true"></div>' +
      '<div id="bvToast" class="fixed z-[60] left-1/2 -translate-x-1/2 bottom-24 lg:bottom-8 px-4 py-3 rounded-xl bg-slate-900 text-white text-sm font-semibold shadow-xl" hidden role="status"></div>');
    var cur = null, render = o.render;
    function nav() {
      $('bvSide').innerHTML = o.nav.map(function (n) { var on = n[0] === cur; return '<a href="#' + n[0] + '" class="flex items-center gap-3 px-4 h-11 rounded-lg font-medium ' + (on ? 'bg-[#2563EB] text-white shadow' : 'text-blue-100 hover:bg-white/10') + '"' + (on ? ' aria-current="page"' : '') + '>' + svg(n[2]) + esc(n[1]) + '</a>'; }).join('');

  past = past.slice(-8);
  var R = B.roster(attCls);
  var head = '<div class="flex flex-col sm:flex-row gap-2 mb-4"><select data-attcls class="h-11 rounded-xl border border-slate-200 bg-white px-3">' + D.classes.map(function (c) { return '<option value="' + c.id + '"' + (c.id === attCls ? ' selected' : '') + '>' + esc(c.name) + ' · ' + esc(c.level) + '</option>'; }).join('') + '</select>' +
    btn('saveAtt', 'Bulk save') + btn('allP', 'Mark all Present', 'att', 'border border-slate-200 bg-white text-slate-700') + '</div>';
  var cyc = { Present: 'Late', Late: 'Absent', Absent: 'Present', '': 'Present' }, sty = { Present: 'bg-emerald-500 text-white', Late: 'bg-amber-400 text-white', Absent: 'bg-red-500 text-white', '': 'bg-slate-100 text-slate-400' };
  var grid = '<div class="overflow-x-auto"><table class="text-sm"><thead><tr><th class="text-left py-2 pr-3 sticky left-0 bg-white">Student</th>' + past.map(function (s) { var d = B.parse(s.date); return '<th class="px-1 text-center font-semibold text-slate-500 whitespace-nowrap">' + B.WD[(d.getDay() + 6) % 7] + '<br>' + d.getDate() + '/' + (d.getMonth() + 1) + '</th>'; }).join('') + '</tr></thead><tbody>' +
    R.map(function (st) { return '<tr class="border-t border-slate-50"><td class="py-2 pr-3 sticky left-0 bg-white whitespace-nowrap"><span class="flex items-center gap-2">' + B.avatar(st.name, st.avatar, 'w-7 h-7 text-[10px]') + esc(st.name) + '</span></td>' + past.map(function (s) {
      var k = s.id + '|' + st.id, a = D.attendance.filter(function (x) { return x.date === s.date && x.classId === s.classId && x.studentId === st.id; })[0], v = pending[k] !== undefined ? pending[k] : a ? a.status : '';
      return '<td class="px-1 py-1 text-center"><button type="button" data-cell="' + esc(k) + '" data-next="' + cyc[v] + '" class="w-10 h-9 rounded-lg text-xs font-bold ' + sty[v] + (pending[k] !== undefined ? ' ring-2 ring-[#2563EB]' : '') + '" aria-label="' + esc(st.name) + ' ' + s.date + ': ' + (v || 'not marked') + '">' + (v ? v[0] : '·') + '</button></td>';
    }).join('') + '</tr>'; }).join('') + '</tbody></table></div>';
  el.innerHTML = head + B.card(grid + '<p class="text-xs text-slate-500 mt-3">Tap a cell to cycle Present → Late → Absent. Changed cells are outlined; press <b>Bulk save</b>. ' + Object.keys(pending).length + ' unsaved.</p>', 'p-4');
  el._past = past;
}
function saveAtt() {
  var n = 0;
  Object.keys(pending).forEach(function (k) {
    var p = k.split('|'), sc = p[0], date = p[1], sid = p[2], s = B.by(D.schedules, sc);
    D.attendance = D.attendance.filter(function (a) { return !(a.date === date && a.studentId === sid && a.classId === (s ? s.classId : attCls)); });
    D.attendance.push({ id: B.uid('a'), studentId: sid, scheduleId: sc, classId: s ? s.classId : attCls, date: date, status: pending[k], note: '' }); n++;
  });
  pending = {}; B.save(); B.toast('Saved ' + n + ' attendance records'); app.refresh();
}

function payments(el) {
  var m = curMonth(), P = D.payments.filter(function (p) { return p.month === m && (!fstatus || p.status === fstatus); });
  var all = D.payments.filter(function (p) { return p.month === m; }), sum = function (st) { return all.filter(function (p) { return p.status === st; }).reduce(function (s, p) { return s + p.amount; }, 0); };
  el.innerHTML = '<div class="grid grid-cols-1 sm:grid-cols-3 gap-3 mb-5">' + B.stat('Paid', B.money(sum('Paid')), all.filter(function (p) { return p.status === 'Paid'; }).length + ' students', true, 'pay') + B.stat('Unpaid', B.money(sum('Unpaid')), all.filter(function (p) { return p.status === 'Unpaid'; }).length + ' students', false, 'pay') + B.stat('Overdue', B.money(sum('Overdue')), all.filter(function (p) { return p.status === 'Overdue'; }).length + ' students', false, 'pay') + '</div>' +
    toolbar('Search students...', btn('csvPay', 'CSV', 'dl', 'border border-slate-200 bg-white text-slate-700'), '<select data-fs class="h-11 rounded-xl border border-slate-200 bg-white px-3">' + ['', 'Paid', 'Unpaid', 'Overdue'].map(function (x) { return '<option value="' + x + '"' + (x === fstatus ? ' selected' : '') + '>' + (x || 'All status') + '</option>'; }).join('') + '</select>') +
    table(['Student', 'Class', 'Month', 'Amount', 'Status', 'Paid at', ''], P.filter(function (p) { var s = B.by(D.students, p.studentId); return s && match(s.name); }).map(function (p) {
      var s = B.by(D.students, p.studentId);
      return '<tr class="border-b border-slate-50"><td class="py-2 pr-3 font-medium whitespace-nowrap">' + esc(s.name) + '</td><td class="pr-3 whitespace-nowrap">' + esc(cls(s['class']).name) + '</td><td class="pr-3">' + p.month + '</td><td class="pr-3 whitespace-nowrap">' + B.money(p.amount) + '</td><td class="pr-3">' + badge(p.status) + '</td><td class="pr-3">' + (p.paidAt || '–') + '</td>' +
        '<td>' + (p.status !== 'Paid' ? '<button type="button" data-act="markPaid" data-id="' + p.id + '" class="h-9 px-3 rounded-lg bg-emerald-600 text-white text-xs font-semibold whitespace-nowrap">Mark paid</button>' : '') + '</td></tr>';
    }));
}

function reports(el) {
  var byClass = D.classes.map(function (c) { var A = D.attendance.filter(function (a) { return a.classId === c.id; }); return [c, B.rateOf(A), A.length]; });
  var m = curMonth(), rev = D.classes.map(function (c) { var P = D.payments.filter(function (p) { var s = B.by(D.students, p.studentId); return p.month === m && s && s['class'] === c.id; }); return [c, P.filter(function (p) { return p.status === 'Paid'; }).reduce(function (s, p) { return s + p.amount; }, 0), P.reduce(function (s, p) { return s + p.amount; }, 0)]; });
  var mx = Math.max.apply(null, rev.map(function (r) { return r[2]; }).concat([1]));
  el.innerHTML = '<div class="grid lg:grid-cols-2 gap-5">' +
    B.card('<div class="flex items-center justify-between mb-4"><h2 class="font-bold">Attendance by class</h2>' + btn('csvAtt', 'Export', 'dl', 'border border-slate-200 bg-white text-slate-700 h-9') + '</div>' + byClass.map(function (r) { var T = B.TYPE[r[0].type]; return '<div class="mb-3"><div class="flex justify-between text-sm"><span>' + esc(r[0].name) + '</span><b>' + r[1] + '%</b></div><div class="h-2.5 rounded-full bg-slate-100 mt-1 overflow-hidden"><div class="h-full rounded-full" style="width:' + r[1] + '%;background:' + T.c + '"></div></div><p class="text-xs text-slate-400 mt-0.5">' + r[2] + ' records</p></div>'; }).join('')) +
    B.card('<div class="flex items-center justify-between mb-4"><h2 class="font-bold">Revenue ' + m + '</h2>' + btn('csvRev', 'Export', 'dl', 'border border-slate-200 bg-white text-slate-700 h-9') + '</div>' + rev.map(function (r) { return '<div class="mb-3"><div class="flex justify-between text-sm"><span>' + esc(r[0].name) + '</span><b>' + B.money(r[1]) + '</b></div><div class="h-2.5 rounded-full bg-slate-100 mt-1 overflow-hidden"><div class="h-full bg-[#2563EB]" style="width:' + Math.round(r[1] / mx * 100) + '%"></div></div><p class="text-xs text-slate-400 mt-0.5">of ' + B.money(r[2]) + ' expected</p></div>'; }).join('')) + '</div>' +
    '<div class="mt-5">' + B.card('<h2 class="font-bold">Demo data</h2><p class="text-sm text-slate-500 mt-1">All data lives in this browser (localStorage key <code>brightvista_db</code>).</p><button type="button" data-act="reset" class="mt-3 h-11 px-4 rounded-xl border border-red-200 text-red-600 font-semibold">Reset demo data</button>') + '</div>';
}

/* ---------- events ---------- */
document.addEventListener('click', function (e) {
  var t = e.target.closest ? e.target : null; if (!t) return;
  var a = t.closest('[data-act]'), id = a && a.getAttribute('data-id');
  if (a) {
    var act = a.getAttribute('data-act');
    if (act === 'addStu') stuForm(); else if (act === 'editStu') stuForm(B.by(D.students, id));
    else if (act === 'delStu') { var s = B.by(D.students, id); if (confirm('Delete ' + s.name + '?')) { D.students = D.students.filter(function (x) { return x.id !== id; }); D.payments = D.payments.filter(function (x) { return x.studentId !== id; }); D.attendance = D.attendance.filter(function (x) { return x.studentId !== id; }); B.save(); B.toast('Student deleted'); app.refresh(); } }
    else if (act === 'addCls') clsForm(); else if (act === 'editCls') clsForm(B.by(D.classes, id));
    else if (act === 'delCls') { var c = B.by(D.classes, id); if (B.roster(id).length) { B.toast('Move students out of ' + c.name + ' first'); return; } if (confirm('Delete class ' + c.name + '?')) { D.classes = D.classes.filter(function (x) { return x.id !== id; }); D.schedules = D.schedules.filter(function (x) { return x.classId !== id; }); B.save(); app.refresh(); } }
    else if (act === 'addTea') B.modal('Add teacher', B.field('Name', B.inp('name', 'Mr. ', 'required')) + '<div class="mt-3">' + B.field('Skill', B.inp('skill', 'IELTS')) + '</div>', function (f) { if (f.name.value.trim().length < 3) return 'Name is required'; D.teachers.push({ id: B.uid('t'), name: f.name.value.trim(), skill: f.skill.value.trim(), avatar: ['#2563EB', '#8B5CF6', '#F59E0B', '#0EA5E9', '#10B981'][D.teachers.length % 5] }); B.save(); B.toast('Teacher added'); app.refresh(); });
    else if (act === 'resetPw') { var Dd = B.db(), x = Dd.users.filter(function (k) { return k.u === id; })[0]; if (x && confirm('Đặt lại mật khẩu của ' + id + ' về 1234?')) { delete x.h; B.save(); B.toast('Đã đặt lại mật khẩu ' + id); app.refresh(); } }
    else if (act === 'csvAcc') B.csv([['Tên đăng nhập', 'Vai trò', 'Họ tên', 'Mật khẩu']].concat(B.users().map(function (x) { return [x.u, B.ROLE_VI[x.role], x.name, x.h ? '(đã đổi)' : '1234']; })), 'tai-khoan.csv');
    else if (act === 'delZ') { D.zalo = (D.zalo || []).filter(function (z) { return z.id !== id; }); B.save(); B.toast('Đã xóa tin'); app.refresh(); }
    else if (act === 'markPaid') { var p = B.by(D.payments, id); p.status = 'Paid'; p.paidAt = B.iso(today); B.save(); B.toast('Marked as paid'); app.refresh(); }
    else if (act === 'saveAtt') saveAtt();
    else if (act === 'allP') { var el = document.getElementById('bvView'); (el._past || []).forEach(function (s) { B.roster(attCls).forEach(function (st) { pending[s.id + '|' + st.id] = 'Present'; }); }); app.refresh(); }
    else if (act === 'csvStu') B.csv([['ID', 'Name', 'Level', 'Class', 'Parent', 'Phone', 'Fee']].concat(D.students.map(function (s) { return [s.id, s.name, s.level, cls(s['class']).name, s.parent.name, s.parent.phone, feeOf(s.id)]; })), 'students.csv');
    else if (act === 'csvPay') B.csv([['Student', 'Class', 'Month', 'Amount', 'Status', 'Paid at']].concat(D.payments.map(function (p) { var s = B.by(D.students, p.studentId) || { name: p.studentId }; return [s.name, cls(s['class']).name, p.month, p.amount, p.status, p.paidAt]; })), 'payments.csv');
    else if (act === 'csvAtt') B.csv([['Date', 'Class', 'Student', 'Status', 'Note']].concat(D.attendance.slice().sort(function (x, y) { return x.date < y.date ? -1 : 1; }).map(function (r) { var s = B.by(D.students, r.studentId) || { name: r.studentId }; return [r.date, cls(r.classId).name, s.name, r.status, r.note]; })), 'attendance.csv');
    else if (act === 'csvRev') B.csv([['Class', 'Month', 'Paid', 'Expected']].concat(D.classes.map(function (c) { var P = D.payments.filter(function (p) { var s = B.by(D.students, p.studentId); return p.month === curMonth() && s && s['class'] === c.id; }); return [c.name, curMonth(), P.filter(function (p) { return p.status === 'Paid'; }).reduce(function (s, p) { return s + p.amount; }, 0), P.reduce(function (s, p) { return s + p.amount; }, 0)]; })), 'revenue.csv');
    else if (act === 'reset') { if (confirm('Reset all demo data?')) { D = B.reset(); pending = {}; B.toast('Demo data reset'); app.refresh(); } }
    return;
  }
  var wk = t.closest('[data-wk]'); if (wk) { w0 = B.addD(w0, 7 * +wk.getAttribute('data-wk')); app.refresh(); return; }
  var mv = t.closest('[data-move]'); if (mv) { move(mv.getAttribute('data-move'), +mv.getAttribute('data-day')); return; }
  var cell = t.closest('[data-cell]'); if (cell) { pending[cell.getAttribute('data-cell')] = cell.getAttribute('data-next'); app.refresh(); }
});
document.addEventListener('input', function (e) { if (e.target.hasAttribute && e.target.hasAttribute('data-q')) { q = e.target.value.trim().toLowerCase(); var pos = e.target.selectionStart; app.refresh(); var n = document.querySelector('[data-q]'); if (n) { n.focus(); try { n.setSelectionRange(pos, pos); } catch (x) { } } } });
document.addEventListener('change', function (e) {
  var t = e.target;
  if (t.hasAttribute('data-fs')) { fstatus = t.value; app.refresh(); }
  else if (t.hasAttribute('data-accrole')) { accRole = t.value; app.refresh(); }
  else if (t.hasAttribute('data-attcls')) { attCls = t.value; pending = {}; app.refresh(); }
  else if (t.hasAttribute('data-assign') && t.value) { var c = B.by(D.classes, t.value); c.teacherId = t.getAttribute('data-assign'); B.save(); B.toast(c.name + ' → ' + B.by(D.teachers, c.teacherId).name); app.refresh(); }
});
document.addEventListener('dragstart', function (e) { var s = e.target.closest && e.target.closest('[data-sc]'); if (s) { drag = s.getAttribute('data-sc'); e.dataTransfer.effectAllowed = 'move'; try { e.dataTransfer.setData('text/plain', drag); } catch (x) { } } });
document.addEventListener('dragover', function (e) { var z = e.target.closest && e.target.closest('[data-drop]'); if (z && drag) { e.preventDefault(); z.classList.add('border-[#2563EB]', 'bg-blue-50'); } });
document.addEventListener('dragleave', function (e) { var z = e.target.closest && e.target.closest('[data-drop]'); if (z) z.classList.remove('border-[#2563EB]', 'bg-blue-50'); });
document.addEventListener('drop', function (e) { var z = e.target.closest && e.target.closest('[data-drop]'); if (z && drag) { e.preventDefault(); move(drag, +z.getAttribute('data-drop')); drag = null; } });
B.sw('../'); app.route();
});
</script>
</body>
</html>
