<script>/* BrightVista – lõi dùng chung cho mọi portal (nhúng vào từng file HTML khi build).
   CSDL demo: localStorage 'brightvista_db'. Lịch tuần tính sẵn lưu đệm 5 phút: 'brightvista_cache'. */
var BV = (function () {
  'use strict';
  var KEY = 'brightvista_db', CKEY = 'brightvista_cache', TTL = 300000;
  var pad = function (n) { return (n < 10 ? '0' : '') + n; };
  var iso = function (d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };
  var parse = function (s) { var p = String(s).split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); };
  var addD = function (d, n) { var x = new Date(d); x.setDate(x.getDate() + n); return x; };
  var monOf = function (d) { var x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); return addD(x, -((x.getDay() + 6) % 7)); };
  var tm = function (t) { var p = String(t || '0:0').split(':'); return +p[0] * 60 + (+p[1] || 0); };
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  var MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  var WD = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
  var TYPE = { IELTS: { c: '#3B82F6', bg: 'bg-blue-50', tx: 'text-blue-700' }, TOEIC: { c: '#F59E0B', bg: 'bg-amber-50', tx: 'text-amber-700' }, Kids: { c: '#8B5CF6', bg: 'bg-violet-50', tx: 'text-violet-700' } };
  var ROOMS = [{ id: '101', cap: 12 }, { id: '103', cap: 15 }, { id: '201', cap: 20 }, { id: '202', cap: 20 }, { id: '204', cap: 16 }, { id: '301', cap: 24 }];
  var store = {
    get: function (k, d) { try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
    set: function (k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* riêng tư / đầy */ } },
    del: function (k) { try { localStorage.removeItem(k); } catch (e) { } }
  };

  /* ---------- dữ liệu mẫu ---------- */
  function seed() {
    var today = new Date(), w0 = monOf(today);
    var teachers = [
      { id: 't1', name: 'Mr. David', avatar: '#2563EB', skill: 'IELTS Speaking', email: 'david@brightvista.edu' },
      { id: 't2', name: 'Ms. Anna', avatar: '#8B5CF6', skill: 'Kids English', email: 'anna@brightvista.edu' },
      { id: 't3', name: 'Ms. Sarah', avatar: '#F59E0B', skill: 'TOEIC Reading', email: 'sarah@brightvista.edu' },
      { id: 't4', name: 'Mr. James', avatar: '#0EA5E9', skill: 'TOEIC Listening', email: 'james@brightvista.edu' },
      { id: 't5', name: 'Ms. Linh', avatar: '#10B981', skill: 'IELTS Writing & Phonics', email: 'linh@brightvista.edu' }];
    var classes = [
      { id: 'c1', name: 'IELTS Speaking', type: 'IELTS', level: 'B2', teacherId: 't1', room: '201', fee: 2400000 },
      { id: 'c2', name: 'IELTS Writing', type: 'IELTS', level: 'B1', teacherId: 't5', room: '204', fee: 2400000 },
      { id: 'c3', name: 'TOEIC Reading', type: 'TOEIC', level: '600+', teacherId: 't3', room: '202', fee: 2100000 },
      { id: 'c4', name: 'TOEIC Listening', type: 'TOEIC', level: '450+', teacherId: 't4', room: '202', fee: 2100000 },
      { id: 'c5', name: 'Kids Fun English', type: 'Kids', level: 'Starters', teacherId: 't2', room: '103', fee: 1600000 },
      { id: 'c6', name: 'Kids Phonics', type: 'Kids', level: 'Pre-A1', teacherId: 't5', room: '103', fee: 1500000 }];
    var S = [['c1', 0, '09:00', '10:30'], ['c1', 2, '09:00', '10:30'], ['c1', 4, '09:00', '10:30'], ['c1', 5, '09:00', '10:30'],
      ['c2', 1, '18:00', '19:30'], ['c2', 3, '18:00', '19:30'], ['c2', 5, '14:00', '15:30'], ['c2', 6, '09:00', '10:30'],
      ['c3', 0, '17:00', '18:30'], ['c3', 1, '10:45', '12:15'], ['c3', 3, '10:45', '12:15'], ['c3', 5, '10:45', '12:15'],
      ['c4', 0, '19:00', '20:30'], ['c4', 2, '19:00', '20:30'], ['c4', 4, '18:00', '19:30'], ['c4', 6, '14:00', '15:30'],
      ['c5', 0, '14:00', '15:00'], ['c5', 2, '16:00', '17:00'], ['c5', 3, '14:00', '15:00'], ['c5', 5, '08:00', '09:00'],
      ['c6', 1, '16:00', '17:00'], ['c6', 2, '14:00', '15:00'], ['c6', 4, '16:00', '17:00'], ['c6', 5, '16:00', '17:00']];
    var schedules = S.map(function (x, i) { var c = classes.filter(function (k) { return k.id === x[0]; })[0]; return { id: 'sc' + (i + 1), classId: x[0], day: x[1], time: x[2], end: x[3], room: c.room }; });
    var N = ['Nguyễn Minh An', 'Trần Bảo Châu', 'Lê Gia Huy', 'Phạm Khánh Linh', 'Hoàng Đức Minh', 'Võ Ngọc Hân', 'Đặng Quốc Bảo', 'Bùi Thảo Vy', 'Đỗ Hải Nam', 'Ngô Phương Anh',
      'Dương Tuấn Kiệt', 'Lý Mai Chi', 'Phan Đăng Khoa', 'Vũ Hà My', 'Trịnh Gia Bảo', 'Mai Thùy Dương', 'Hồ Minh Khôi', 'Tạ Ngọc Diệp', 'Lâm Quang Vinh', 'Cao Bảo Ngọc',
      'Đinh Hoàng Long', 'Châu Thanh Tâm', 'Kiều Anh Thư', 'Lục Minh Đức', 'Quách Gia Hân', 'Tôn Nhật Minh', 'Âu Khánh Vy', 'Hà Thiên Ân', 'La Bảo Trâm', 'Từ Minh Quân'];
    var PCOL = ['#2563EB', '#8B5CF6', '#F59E0B', '#0EA5E9', '#10B981', '#EC4899'];
    var students = N.map(function (n, i) {
      var c = classes[i % 6], last = n.split(' ')[0];
      return { id: 'S' + pad(i + 1), name: n, level: c.level, class: c.id, avatar: PCOL[i % 6], dob: (c.type === 'Kids' ? 2016 : 2006) + (i % 4) + '-0' + (1 + i % 9) + '-1' + (i % 9),
        parent: { name: (i % 2 ? 'Mrs. ' : 'Mr. ') + last + ' ' + ['Hùng', 'Lan', 'Dũng', 'Hoa', 'Tuấn', 'Nga'][i % 6], phone: '09' + (12345678 + i * 104729) % 100000000, email: 'parent' + (i + 1) + '@mail.com' } };
    });
    var attendance = [], k = 0;
    for (var back = 21; back >= 1 && attendance.length < 100; back--) {
      var d = addD(today, -back), wd = (d.getDay() + 6) % 7;
      schedules.filter(function (s) { return s.day === wd; }).forEach(function (s) {
        students.filter(function (st) { return st.class === s.classId; }).forEach(function (st) {
          if (attendance.length >= 100) return;
          k++; var st2 = k % 13 === 0 ? 'Absent' : k % 7 === 0 ? 'Late' : 'Present';
          attendance.push({ id: 'a' + k, studentId: st.id, scheduleId: s.id, classId: s.classId, date: iso(d), status: st2, note: st2 === 'Late' ? 'Late 10 min' : st2 === 'Absent' ? 'Sick' : '' });
        });
      });
    }
    var m = iso(today).slice(0, 7), pm = iso(addD(new Date(today.getFullYear(), today.getMonth(), 1), -1)).slice(0, 7);
    var payments = [];
    students.forEach(function (st, i) {
      var c = classes.filter(function (x) { return x.id === st.class; })[0];
      payments.push({ id: 'p' + (i * 2 + 1), studentId: st.id, month: pm, amount: c.fee, status: i % 10 === 3 ? 'Overdue' : 'Paid', paidAt: i % 10 === 3 ? '' : pm + '-0' + (2 + i % 7) });
      payments.push({ id: 'p' + (i * 2 + 2), studentId: st.id, month: m, amount: c.fee, status: i % 4 === 0 ? 'Unpaid' : i % 10 === 3 ? 'Overdue' : 'Paid', paidAt: i % 4 === 0 || i % 10 === 3 ? '' : m + '-0' + (1 + i % 5) });
    });
    var comments = students.slice(0, 18).map(function (st, i) {
      var c = classes.filter(function (x) { return x.id === st.class; })[0];
      return { id: 'cm' + i, studentId: st.id, teacherId: c.teacherId, date: iso(addD(today, -(i % 10) - 1)),
        text: ['Great pronunciation progress this week.', 'Needs more vocabulary practice at home.', 'Very active in speaking activities.', 'Homework done carefully, keep it up!', 'Please review grammar unit 4.', 'Confident presentation today.'][i % 6] };
    });
    var homework = classes.map(function (c, i) { return { id: 'h' + i, classId: c.id, title: ['Speaking part 2: describe a place', 'Task 2 essay: technology', 'Reading test 3 (Part 7)', 'Listening Part 3 practice', 'Unit 5 song + flashcards', 'Phonics worksheet: sh / ch'][i], due: iso(addD(today, 2 + i % 3)) }; });
    return { v: 1, created: iso(today), students: students, teachers: teachers, classes: classes, schedules: schedules, attendance: attendance, payments: payments, comments: comments, homework: homework };
  }
  var DB = null;
  function db() { if (!DB) { DB = store.get(KEY, null); if (!DB || DB.v !== 1) { DB = seed(); save(); } } return DB; }
  function save() { store.set(KEY, DB); store.del(CKEY); }
  function reset() { store.del(KEY); store.del(CKEY); DB = null; return db(); }
  function by(list, id) { for (var i = 0; i < list.length; i++) if (list[i].id === id) return list[i]; return null; }
  function uid(p) { return p + Date.now().toString(36) + Math.floor(Math.random() * 1e4).toString(36); }

  /* ---------- buổi học theo ngày (lịch tuần lặp lại), lưu đệm 5 phút ---------- */
  function sessions(from, to) {
    var key = iso(from) + '_' + iso(to), c = store.get(CKEY, null);
    if (c && c.key === key && Date.now() - c.t < TTL) return c.data;
    var D = db(), out = [];
    for (var d = new Date(from); d <= to; d = addD(d, 1)) {
      var wd = (d.getDay() + 6) % 7, ds = iso(d);
      D.schedules.forEach(function (s) {
        if (s.day !== wd || (s.date && s.date !== ds)) return;
        var cl = by(D.classes, s.classId); if (!cl) return;
        out.push({ id: s.id + '|' + ds, scheduleId: s.id, classId: cl.id, date: ds, time: s.time, end: s.end, room: s.room || cl.room, name: cl.name, type: cl.type, level: cl.level, teacherId: cl.teacherId });
      });
    }
    out.sort(function (a, b) { return a.date < b.date ? -1 : a.date > b.date ? 1 : tm(a.time) - tm(b.time); });
    store.set(CKEY, { key: key, t: Date.now(), data: out });
    return out;
  }
  function roster(classId) { return db().students.filter(function (s) { return s.class === classId; }); }
  function attOf(sessionDate, classId) { return db().attendance.filter(function (a) { return a.date === sessionDate && a.classId === classId; }); }
  function presentCount(se) { var A = attOf(se.date, se.classId); return { p: A.filter(function (a) { return a.status === 'Present'; }).length, l: A.filter(function (a) { return a.status === 'Late'; }).length, a: A.filter(function (a) { return a.status === 'Absent'; }).length, n: roster(se.classId).length, done: A.length > 0 }; }
  function setAttendance(se, map, notes) {
    var D = db();
    D.attendance = D.attendance.filter(function (a) { return !(a.date === se.date && a.classId === se.classId); });
    Object.keys(map).forEach(function (sid) { D.attendance.push({ id: uid('a'), studentId: sid, scheduleId: se.scheduleId, classId: se.classId, date: se.date, status: map[sid], note: (notes && notes[sid]) || '' }); });
    save();
  }
  function rateOf(list) { if (!list.length) return 0; return Math.round(list.filter(function (a) { return a.status !== 'Absent'; }).length / list.length * 100); }

  /* ---------- giao diện ---------- */
  var IC = {
    dash: '<path d="M3 13h8V3H3zm10 8h8V11h-8zM3 21h8v-6H3zm10-18v6h8V3z"/>',
    stu: '<path d="M12 3 2 8l10 5 10-5-10-5Zm-6 7.5V15c0 1.7 2.7 3 6 3s6-1.3 6-3v-4.5"/>',
    cls: '<path d="M4 5h16v11H4zM8 20h8M12 16v4"/>',
    cal: '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/>',
    tea: '<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',
    room: '<path d="M4 21V5a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v16M2 21h20M14 12h.01"/>',
    att: '<path d="m9 12 2 2 4-4"/><rect x="3" y="4" width="18" height="17" rx="2"/>',
    pay: '<rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/>',
    rep: '<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',
    hw: '<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5z"/><path d="M8 7h8M8 11h6"/>',
    home: '<path d="m3 11 9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
    user: '<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',
    chat: '<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>',
    plus: '<path d="M12 5v14M5 12h14"/>', dl: '<path d="M12 3v12m0 0-4-4m4 4 4-4M4 21h16"/>', edit: '<path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>', del: '<path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/>'
  };
  var svg = function (k, c) { return '<svg class="' + (c || 'w-5 h-5') + '" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24" aria-hidden="true">' + (IC[k] || '') + '</svg>'; };
  var ini = function (n) { return String(n).replace(/^(Mr\.|Ms\.|Mrs\.)\s*/, '').split(' ').filter(Boolean).map(function (w) { return w[0]; }).join('').slice(-2).toUpperCase(); };
  var avatar = function (name, color, size) { return '<span class="grid place-items-center shrink-0 rounded-full text-white font-bold ' + (size || 'w-9 h-9 text-xs') + '" style="background:' + (color || '#2563EB') + '">' + esc(ini(name)) + '</span>'; };
  var weekLabel = function (w) { var e = addD(w, 6); return MON[w.getMonth()] + ' ' + w.getDate() + '–' + (e.getMonth() !== w.getMonth() ? MON[e.getMonth()] + ' ' + e.getDate() : e.getDate()) + ', ' + e.getFullYear(); };
  var money = function (n) { return (+n || 0).toLocaleString('vi-VN') + ' ₫'; };
  var $ = function (id) { return document.getElementById(id); };

  /** Khung trang: sidebar navy 260px (PC), thanh trên có link các portal, bottom nav 5 mục (mobile). */
  function layout(o) {
    // o = {base:'../', portal:'admin', title, sub, nav:[[id,label,icon]], bnav:[[id,label,icon]], userName, userSub, picker:'html'}
    var P = [['portal.html', 'Dashboard'], ['admin/', 'Admin'], ['teacher/', 'Teacher'], ['student/', 'Student'], ['parent/', 'Parent']];
    document.body.insertAdjacentHTML('afterbegin',
      '<aside class="hidden lg:flex fixed inset-y-0 left-0 w-[260px] flex-col bg-[#1E3A8A] text-white z-40">' +
      '<a href="' + o.base + 'portal.html" class="flex items-center gap-3 px-6 pt-7 pb-6"><span class="grid place-items-center w-11 h-11 rounded-xl bg-white/15 text-2xl">🎓</span><span><b class="block text-xl tracking-tight">BrightVista</b><span class="text-sm text-blue-200">' + esc(o.brandSub || 'English Center') + '</span></span></a>' +
      '<nav id="bvSide" class="flex-1 px-4 space-y-1 overflow-y-auto" aria-label="Main"></nav>' +
      '<div class="m-4 p-3 rounded-xl bg-white/10 flex items-center gap-3"><span id="bvAva">' + avatar(o.userName || 'Admin', '#60A5FA', 'w-10 h-10 text-sm') + '</span><div class="min-w-0"><p id="bvUser" class="font-semibold text-sm truncate">' + esc(o.userName || '') + '</p><p id="bvUserSub" class="text-xs text-blue-200 truncate">' + esc(o.userSub || '') + '</p></div></div></aside>' +
      '<div class="lg:ml-[260px] min-h-screen pb-24 lg:pb-10">' +

      '<a href="' + o.base + 'portal.html" class="lg:hidden grid place-items-center w-9 h-9 rounded-lg bg-[#1E3A8A] text-lg">🎓</a>' +
      '<div class="min-w-0 flex-1"><h1 id="bvTitle" class="font-extrabold text-slate-900 truncate"></h1></div>' + (o.picker || '') +

      '<details class="md:hidden relative"><summary class="list-none grid place-items-center w-9 h-9 rounded-lg border border-slate-200 text-slate-600" aria-label="Switch portal">⇄</summary><div class="absolute right-0 mt-2 w-44 bg-white rounded-xl shadow-xl border border-slate-100 p-1">' +
      P.map(function (p) { return '<a href="' + o.base + p[0] + '" class="block px-3 py-2 rounded-lg text-sm font-semibold ' + (p[1].toLowerCase() === o.portal ? 'text-[#2563EB] bg-blue-50' : 'text-slate-700') + '">' + p[1] + '</a>'; }).join('') + '</div></details>' +
      '</div></header><main id="bvMain" class="px-4 lg:px-8 pt-5 lg:pt-8"><p id="bvSub" class="hidden lg:block text-slate-500 -mt-3 mb-6"></p><div id="bvView"></div></main></div>' +
      '<nav class="lg:hidden fixed bottom-0 inset-x-0 z-40 bg-white border-t border-slate-200" style="padding-bottom:env(safe-area-inset-bottom,0px)" aria-label="Bottom"><div id="bvBottom" class="grid grid-cols-' + o.bnav.length + '"></div></nav>' +

    var cur = null, render = o.render;

      var it = o.nav.filter(function (n) { return n[0] === cur; })[0] || o.bnav.filter(function (n) { return n[0] === cur; })[0];
      $('bvTitle').textContent = (it ? it[1] : '') + (o.titleSuffix ? ' · ' + o.titleSuffix : '');
      $('bvSub').textContent = (o.subs && o.subs[cur]) || '';
    }
    function route() {

      $('bvView').innerHTML = '<div class="grid gap-3 sm:grid-cols-2 lg:grid-cols-4">' + skeleton(4, 'h-24') + '</div><div class="mt-4 space-y-3">' + skeleton(3, 'h-16') + '</div>';
      var v = $('bvView'); requestAnimationFrame(function () { render(cur, v); v.classList.remove('fade'); void v.offsetWidth; v.classList.add('fade'); });

    }

  var todayS=sched(today,today),busy={};todayS.forEach(function(s){busy[s.room]=1});
  var att=D.attendance.filter(function(a){return a.date>=iso(addD(week0,-7))}),rate=B.rateOf(att.length?att:D.attendance),booked=Object.keys(busy).length,diff=w.length-prev.length;
  $('stats').innerHTML=card('Classes This Week',w.length+' <span class="text-base font-semibold">Classes</span>',(diff>=0?'+':'')+diff+' from last week',true,'cal')+
    card('Active Students',D.students.length,'+'+Math.max(D.students.length-27,0)+' this month',false,'stu')+card('Rooms Booked',booked+'/'+B.ROOMS.length,Math.round(booked/B.ROOMS.length*100)+'% Occupancy',false,'room')+card('Attendance Rate',rate+'%','+2% vs last week',false,'att');
  $('weekTitle').textContent='Week of '+weekLabel(week0);
  [].forEach.call(document.querySelectorAll('[data-mode]'),function(b){var on=b.getAttribute('data-mode')===mode;b.className='px-4 h-9 rounded-lg text-sm font-semibold '+(on?'bg-[#2563EB] text-white shadow':'text-slate-600')});
  var wf=w.filter(match);
  $('cal').innerHTML=mode==='week'?B.weekGrid(B.sessions(week0,addD(week0,6)).filter(function(s){return match({name:s.name,room:s.room,teacher:s.teacherId,level:s.level})}),week0):mode==='month'?calMonth():calList(wf);
  mobile(w);roomStatus();weekSelect();
}
function match(s){return !query||(s.name+' '+s.room+' '+teacher(s.teacher).name+' '+s.level).toLowerCase().indexOf(query)>=0}
function calMonth(){var m1=new Date(week0.getFullYear(),week0.getMonth(),1),start=monOf(m1),all=B.sessions(start,addD(start,41)),h='<div class="grid grid-cols-7 gap-2 text-center text-xs font-semibold text-slate-500 mb-2">'+WD.map(function(x){return '<div>'+x+'</div>'}).join('')+'</div><div class="grid grid-cols-7 gap-2">';
  for(var i=0;i<42;i++){var d=addD(start,i),ds=iso(d),n=all.filter(function(s){return s.date===ds}),out=d.getMonth()!==m1.getMonth();
    h+='<button type="button" data-goweek="'+ds+'" class="h-20 rounded-xl border text-left p-2 '+(ds===iso(today)?'border-[#2563EB] bg-blue-50':'border-slate-100 bg-white')+(out?' opacity-40':'')+'"><b class="text-sm">'+d.getDate()+'</b><div class="flex flex-wrap gap-1 mt-1">'+
      n.slice(0,6).map(function(s){return '<i class="w-2 h-2 rounded-full" style="background:'+(TYPE[s.type]||TYPE.IELTS).c+'"></i>'}).join('')+'</div>'+(n.length?'<p class="text-[10px] text-slate-500 mt-1">'+n.length+' classes</p>':'')+'</button>'}
  return h+'</div>'}
function calList(L){return '<div class="overflow-x-auto"><table class="w-full text-sm"><thead><tr class="text-left text-slate-500 border-b"><th class="py-2">Date</th><th>Time</th><th>Class</th><th>Level</th><th>Room</th><th>Teacher</th><th>Present</th></tr></thead><tbody>'+
  L.map(function(s){var d=parse(s.date),T=TYPE[s.type]||TYPE.IELTS,c=pc(s);return '<tr class="border-b border-slate-50"><td class="py-2">'+WD[(d.getDay()+6)%7]+' '+d.getDate()+'</td><td>'+s.start+'–'+s.end+'</td><td><i class="inline-block w-2 h-2 rounded-full mr-2" style="background:'+T.c+'"></i>'+esc(s.name)+'</td><td>'+esc(s.level)+'</td><td>'+esc(s.room)+'</td><td>'+esc(teacher(s.teacher).name)+'</td><td>'+(c.done?(c.p+c.l)+'/'+c.n:'–')+'</td></tr>'}).join('')+'</tbody></table></div>'}
function mobile(w){
  var h='';for(var i=0;i<7;i++){var d=addD(week0,i),ds=iso(d),on=ds===selDate;
    h+='<button type="button" data-date="'+ds+'" class="shrink-0 w-14 h-16 rounded-2xl flex flex-col items-center justify-center '+(on?'bg-[#2563EB] text-white shadow-lg shadow-blue-200':'bg-white border border-slate-100 text-slate-600')+'"><span class="text-[11px] font-medium">'+WD[i]+'</span><span class="text-lg font-bold">'+d.getDate()+'</span></button>'}
  $('pills').innerHTML=h;
  var sd=parse(selDate),list=w.filter(function(s){return s.date===selDate&&match(s)});
  $('todayTitle').textContent=(selDate===iso(today)?'Today · ':'')+WD[(sd.getDay()+6)%7]+' '+MON[sd.getMonth()]+' '+sd.getDate();
  $('todayList').innerHTML=list.length?list.map(function(s){var t=teacher(s.teacher),T=TYPE[s.type]||TYPE.IELTS,c=pc(s);
    return '<a href="#attendance" data-att="'+esc(s.id)+'" class="block bg-white rounded-2xl p-4 border border-slate-100 border-l-4 shadow-sm" style="border-left-color:'+T.c+'"><div class="flex items-start gap-3">'+B.avatar(t.name,t.avatar||T.c,'w-11 h-11 text-sm')+'<div class="flex-1 min-w-0">'+
      '<div class="flex items-start justify-between gap-2"><p class="font-bold text-slate-900">'+esc(s.name)+'</p>'+(c.done?'<span class="shrink-0 text-xs font-bold text-emerald-600">✓ '+(c.p+c.l)+'/'+c.n+'</span>':'<span class="shrink-0 text-xs font-semibold text-slate-400">'+(s.date>iso(today)?'Upcoming':'Not marked')+'</span>')+'</div>'+
      '<p class="text-sm text-slate-500 mt-0.5">'+s.start+'–'+s.end+' · Room '+esc(s.room)+'</p><p class="text-sm text-slate-600">'+esc(t.name)+(c.done?' · Present '+(c.p+c.l)+'/'+c.n:'')+'</p></div></div></a>'}).join('')
    :'<p class="text-sm text-slate-400 bg-white rounded-2xl p-5 border border-slate-100 text-center">No classes on this day</p>';
  var sc=statusCounts(list);
  $('attPills').innerHTML='<span class="px-3 py-1.5 rounded-full bg-emerald-100 text-emerald-700 text-sm font-semibold">Present '+sc.p+'</span><span class="px-3 py-1.5 rounded-full bg-amber-100 text-amber-700 text-sm font-semibold">Late '+sc.l+'</span><span class="px-3 py-1.5 rounded-full bg-red-100 text-red-700 text-sm font-semibold">Absent '+sc.a+'</span>';
}
function roomStatus(){var now=today.getHours()*60+today.getMinutes(),ts=sched(today,today);
  var pick=['201','202','103'].map(function(r){var L=ts.filter(function(s){return s.room===r});
    var cur=L.filter(function(s){return tm(s.start)<=now&&now<tm(s.end)})[0],nxt=L.filter(function(s){return tm(s.start)>now})[0];
    return cur?{r:r,st:'Occupied',s:cur,badge:'In Use',bc:'bg-emerald-100 text-emerald-700',dot:'bg-emerald-500'}:nxt?{r:r,st:'Upcoming',s:nxt,badge:'Booked',bc:'bg-blue-100 text-blue-700',dot:'bg-blue-500'}:{r:r,st:'Available',s:null,badge:'Free',bc:'bg-slate-100 text-slate-600',dot:'bg-slate-400'}});
  $('roomStatus').innerHTML=pick.map(function(x){return '<div class="bg-white rounded-2xl p-5 border border-slate-100 shadow-sm"><div class="flex items-center justify-between"><p class="text-2xl font-extrabold">'+x.r+'</p><span class="text-xs font-bold px-2.5 py-1 rounded-full '+x.bc+'">'+x.badge+'</span></div>'+
    '<p class="mt-2 flex items-center gap-2 text-sm font-semibold"><i class="w-2 h-2 rounded-full '+x.dot+'"></i>'+x.st+'</p><p class="text-sm text-slate-500 mt-1">'+(x.s?esc(x.s.name)+' · '+x.s.start+'–'+x.s.end:'No booking right now')+'</p></div>'}).join('')}
function weekSelect(){var h='';for(var i=-4;i<=4;i++){var w=addD(monOf(today),i*7);h+='<option value="'+iso(w)+'"'+(iso(w)===iso(week0)?' selected':'')+'>Week: '+weekLabel(w)+'</option>'}$('mWeek').innerHTML=h}

function shell(inner){return B.card(inner)}
function table(head,rows){return '<div class="overflow-x-auto"><table class="w-full text-sm"><thead><tr class="text-left text-slate-500 border-b">'+head.map(function(h){return '<th class="py-2 pr-3 font-semibold">'+h+'</th>'}).join('')+'</tr></thead><tbody>'+rows.join('')+'</tbody></table></div>'}
function fee(sid){var m=iso(today).slice(0,7),p=D.payments.filter(function(x){return x.studentId===sid&&x.month===m})[0];return p?p.status:'Unpaid'}
function badge(s){var c={Paid:'text-emerald-600',Unpaid:'text-amber-600',Overdue:'text-red-600'}[s]||'text-slate-500';return '<span class="font-semibold '+c+'">'+s+'</span>'}
function vStudents(){var L=D.students.filter(function(s){return !query||(s.name+' '+s.id).toLowerCase().indexOf(query)>=0});
  $('v-students').innerHTML=shell('<div class="flex justify-between items-center mb-3"><p class="text-sm text-slate-500">'+L.length+' students</p><a href="admin/#students" class="text-sm font-semibold text-[#2563EB]">Manage in Admin →</a></div>'+table(['Student','Level','Class','Parent','Tuition'],L.map(function(s){var c=B.by(D.classes,s['class'])||{name:'—'};
    return '<tr class="border-b border-slate-50"><td class="py-2 pr-3"><span class="flex items-center gap-2">'+B.avatar(s.name,s.avatar,'w-8 h-8 text-[10px]')+esc(s.name)+'</span></td><td class="pr-3">'+esc(s.level)+'</td><td class="pr-3">'+esc(c.name)+'</td><td class="pr-3">'+esc(s.parent.name)+'</td><td>'+badge(fee(s.id))+'</td></tr>'})))}
function vClasses(){$('v-classes').innerHTML='<div class="grid gap-3 sm:grid-cols-2 xl:grid-cols-3">'+D.classes.filter(function(c){return !query||(c.name+c.level).toLowerCase().indexOf(query)>=0}).map(function(c){var T=TYPE[c.type]||TYPE.IELTS,S=D.schedules.filter(function(s){return s.classId===c.id&&!s.date});
  return '<article class="bg-white rounded-2xl p-5 border border-slate-100 border-l-4 shadow-sm" style="border-left-color:'+T.c+'"><div class="flex justify-between gap-2"><b>'+esc(c.name)+'</b><span class="text-xs font-bold px-2 py-0.5 rounded-full h-fit '+T.bg+' '+T.tx+'">'+c.type+'</span></div>'+
  '<p class="text-sm text-slate-500 mt-1">Level '+esc(c.level)+' · Room '+esc(c.room)+'</p><p class="text-sm mt-2">'+(S.map(function(s){return WD[s.day]+' '+s.time}).join(' · ')||'One-off booking')+'</p><p class="text-sm text-slate-600">'+esc(teacher(c.teacherId).name)+' · '+B.roster(c.id).length+' students</p></article>'}).join('')+'</div>'}
function vSchedule(){var w=sched(week0,addD(week0,6));$('v-schedule').innerHTML=shell('<div class="flex items-center gap-3 mb-4"><button type="button" data-wk="-1" class="w-9 h-9 rounded-lg border border-slate-200">‹</button><b>Week of '+weekLabel(week0)+'</b><button type="button" data-wk="1" class="w-9 h-9 rounded-lg border border-slate-200">›</button></div>'+calList(w.filter(match)))}
function vTeachers(){var w=sched(week0,addD(week0,6));$('v-teachers').innerHTML='<div class="grid gap-3 sm:grid-cols-2 xl:grid-cols-3">'+D.teachers.map(function(t){var L=w.filter(function(s){return s.teacher===t.id}),h=L.reduce(function(a,s){return a+(tm(s.end)-tm(s.start))},0)/60;
  return '<div class="bg-white rounded-2xl p-5 border border-slate-100 shadow-sm flex gap-4">'+B.avatar(t.name,t.avatar,'w-12 h-12 text-sm')+'<div><b>'+esc(t.name)+'</b><p class="text-sm text-slate-500">'+esc(t.skill||'')+'</p><p class="text-sm mt-1"><b>'+L.length+'</b> sessions · <b>'+h.toFixed(1)+'</b> h this week</p></div></div>'}).join('')+'</div>'}
function vRooms(){var ts=sched(parse(selDate),parse(selDate));
  $('v-rooms').innerHTML='<label class="text-sm font-medium flex items-center gap-2 mb-4">Day <input id="roomDay" type="date" value="'+selDate+'" class="h-10 rounded-xl border border-slate-200 px-3"></label><div class="grid gap-3 sm:grid-cols-2 xl:grid-cols-3">'+B.ROOMS.map(function(r){var L=ts.filter(function(s){return s.room===r.id});
  return '<div class="bg-white rounded-2xl p-5 border border-slate-100 shadow-sm"><div class="flex justify-between"><b>Room '+r.id+'</b><span class="text-xs text-slate-500">'+r.cap+' seats</span></div><div class="mt-3 space-y-2">'+(L.length?L.map(function(s){var T=TYPE[s.type]||TYPE.IELTS;return '<div class="rounded-lg px-3 py-2 text-sm '+T.bg+'"><b>'+s.start+'–'+s.end+'</b> '+esc(s.name)+'</div>'}).join(''):'<p class="text-sm text-slate-400">Available all day</p>')+'</div></div>'}).join('')+'</div>'}
var attSel=null;
function vAtt(){var opts=[];for(var b=13;b>=0;b--){var d=addD(today,-b);sched(d,d).forEach(function(x){opts.push(x)})}
  var s=opts.filter(function(x){return x.id===attSel})[0]||opts[opts.length-1];if(!s){$('v-attendance').innerHTML=shell('<p class="text-slate-500">No past sessions.</p>');return}
  var R=B.roster(s.classId),A=B.attOf(s.date,s.classId),cur={};R.forEach(function(st){var a=A.filter(function(x){return x.studentId===st.id})[0];cur[st.id]=a?a.status:''});
  $('v-attendance').innerHTML=shell('<label class="text-sm font-medium">Session <select id="attSel" class="mt-1 w-full sm:w-auto h-11 rounded-xl border border-slate-200 px-3">'+opts.slice().reverse().map(function(x){var d=parse(x.date);return '<option value="'+esc(x.id)+'"'+(x.id===s.id?' selected':'')+'>'+WD[(d.getDay()+6)%7]+' '+d.getDate()+' · '+x.start+' · '+esc(x.name)+'</option>'}).join('')+'</select></label>'+
    '<div class="mt-4 divide-y divide-slate-100">'+(R.map(function(st){var v=cur[st.id];return '<div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2 py-2"><span class="flex items-center gap-2 text-sm font-medium">'+B.avatar(st.name,st.avatar,'w-8 h-8 text-[10px]')+esc(st.name)+'</span><span class="flex gap-1">'+
      [['Present','bg-emerald-600'],['Late','bg-amber-500'],['Absent','bg-red-600']].map(function(o){var on=v===o[0];return '<button type="button" data-mark="'+esc(s.id)+'" data-stu="'+st.id+'" data-v="'+o[0]+'" aria-pressed="'+on+'" class="h-10 px-3 rounded-lg text-xs font-semibold border '+(on?o[1]+' text-white border-transparent':'border-slate-200 text-slate-500')+'">'+o[0]+'</button>'}).join('')+'</span></div>'}).join('')||'<p class="text-sm text-slate-400 py-3">No student in this class.</p>')+'</div><p class="text-xs text-slate-400 mt-3">Saved instantly to this device.</p>');
  $('v-attendance')._s=s;}
function vPay(){var m=iso(today).slice(0,7),P=D.payments.filter(function(p){return p.month===m}),sum=function(k){return P.filter(function(p){return p.status===k})};
  $('v-payments').innerHTML='<div class="grid gap-3 sm:grid-cols-3 mb-4">'+card('Paid',sum('Paid').length,B.money(sum('Paid').reduce(function(s,p){return s+p.amount},0)),true,'pay')+card('Unpaid',sum('Unpaid').length,'remind this week',false,'pay')+card('Overdue',sum('Overdue').length,'follow up',false,'pay')+'</div>'+
  shell(table(['Student','Month','Amount','Status'],P.map(function(p){var s=B.by(D.students,p.studentId)||{name:p.studentId};return '<tr class="border-b border-slate-50"><td class="py-2 pr-3">'+esc(s.name)+'</td><td class="pr-3">'+p.month+'</td><td class="pr-3">'+B.money(p.amount)+'</td><td>'+badge(p.status)+'</td></tr>'})))}
function vSet(){$('v-settings').innerHTML=shell('<div class="flex items-center gap-4">'+B.avatar('Minh Anh','#1E3A8A','w-14 h-14 text-lg')+'<div><b>Admin Minh Anh</b><p class="text-sm text-slate-500">minhanh@brightvista.edu</p></div></div>'+
  '<h3 class="font-bold mt-6">Portals</h3><div class="mt-2 grid gap-2 grid-cols-2 sm:grid-cols-4">'+[['admin/','Admin'],['teacher/','Teacher'],['student/','Student'],['parent/','Parent']].map(function(p){return '<a href="'+p[0]+'" class="h-11 grid place-items-center rounded-xl border border-slate-200 font-semibold">'+p[1]+'</a>'}).join('')+'</div>'+
  '<h3 class="font-bold mt-6">Demo data</h3><p class="text-sm text-slate-500">Stored in this browser (localStorage <code>brightvista_db</code>); weekly views cached 5 minutes.</p><button type="button" id="resetDemo" class="mt-3 h-11 px-4 rounded-xl border border-red-200 text-red-600 font-semibold">Reset demo data</button>'+
  '<h3 class="font-bold mt-6">Current system (Google Sheet)</h3><div class="mt-2 grid gap-2 sm:grid-cols-3"><a href="app/admin/" class="h-11 grid place-items-center rounded-xl border border-slate-200 font-semibold">ADMIN (Web App)</a><a href="app/teacher/" class="h-11 grid place-items-center rounded-xl border border-slate-200 font-semibold">Teacher View</a><a href="ctv/" class="h-11 grid place-items-center rounded-xl border border-slate-200 font-semibold">CTV VIEW</a></div>'+
  '<div class="mt-2 grid gap-2 sm:grid-cols-2"><a href="admin.html" class="h-11 grid place-items-center rounded-xl border border-slate-200 font-semibold">📘 Admin handbook</a><a href="guide/teacher.html" class="h-11 grid place-items-center rounded-xl border border-slate-200 font-semibold">📗 Teacher guide</a></div>')}

/* ---------- New Booking: tạo lớp 1 buổi theo ngày, thêm thẳng vào lịch ---------- */
function openModal(){var f=$('bookForm');f.room.innerHTML=B.ROOMS.map(function(r){return '<option value="'+r.id+'">Room '+r.id+'</option>'}).join('');
  f.teacher.innerHTML=D.teachers.map(function(t){return '<option value="'+t.id+'">'+esc(t.name)+'</option>'}).join('');f.date.value=selDate;$('bookMsg').textContent='';$('modal').hidden=false;setTimeout(function(){f.name.focus()},30)}
function closeModal(){$('modal').hidden=true}
$('bookForm').addEventListener('submit',function(e){e.preventDefault();var f=e.target;
  if(tm(f.end.value)<=tm(f.start.value)){$('bookMsg').innerHTML='<span class="text-red-600">End time must be after start time.</span>';return}
  var d=parse(f.date.value),clash=B.sessions(d,d).filter(function(s){return(s.room===f.room.value||s.teacherId===f.teacher.value)&&tm(s.time)<tm(f.end.value)&&tm(f.start.value)<tm(s.end)})[0];
  if(clash){$('bookMsg').innerHTML='<span class="text-red-600 font-semibold">⚠ Conflict with '+esc(clash.name)+' ('+clash.time+'–'+clash.end+', Room '+clash.room+').</span>';return}
  var c={id:B.uid('c'),name:f.name.value.trim(),type:f.type.value,level:f.level.value.trim()||'—',teacherId:f.teacher.value,room:f.room.value,fee:0};
  D.classes.push(c);D.schedules.push({id:B.uid('sc'),classId:c.id,day:(d.getDay()+6)%7,date:f.date.value,time:f.start.value,end:f.end.value,room:c.room});B.save();
  week0=monOf(d);selDate=f.date.value;closeModal();f.reset();B.toast?0:0;if(view!=='dashboard')location.hash='#dashboard';else render()});

/* ---------- events ---------- */
document.addEventListener('click',function(e){var t=e.target.closest?e.target:null;if(!t)return;
  if(t.closest('[data-new]')){openModal();return}
  if(t.closest('[data-close]')||t===$('modal')){closeModal();return}
  var wk=t.closest('[data-wk]');if(wk){week0=addD(week0,7*+wk.getAttribute('data-wk'));selDate=iso(week0);render();return}
  var md=t.closest('[data-mode]');if(md){mode=md.getAttribute('data-mode');render();return}
  var gw=t.closest('[data-goweek]');if(gw){week0=monOf(parse(gw.getAttribute('data-goweek')));mode='week';render();return}
  var dt=t.closest('[data-date]');if(dt){selDate=dt.getAttribute('data-date');render();return}
  var ad=t.closest('[data-att]');if(ad){attSel=ad.getAttribute('data-att');return}
  var mk=t.closest('[data-mark]');if(mk){var s=$('v-attendance')._s,A=B.attOf(s.date,s.classId),map={};B.roster(s.classId).forEach(function(st){var a=A.filter(function(x){return x.studentId===st.id})[0];if(a)map[st.id]=a.status});
    map[mk.getAttribute('data-stu')]=mk.getAttribute('data-v');B.setAttendance(s,map);attSel=s.id;render();return}
  if(t.id==='resetDemo'){D=B.reset();render()}
});
document.addEventListener('change',function(e){var t=e.target;
  if(t.hasAttribute('data-role')&&t.value){location.href=t.value;return}
  if(t.id==='mWeek'){week0=parse(t.value);selDate=t.value;render()}
  else if(t.id==='attSel'){attSel=t.value;vAtt()}
  else if(t.id==='roomDay'){selDate=t.value;vRooms()}});
$('q').addEventListener('input',function(){query=this.value.trim().toLowerCase();render()});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&!$('modal').hidden)closeModal()});
window.addEventListener('hashchange',route);
B.sw('');
skel();requestAnimationFrame(route);
})();
